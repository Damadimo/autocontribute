[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "autocontribute"
version = "0.1.0"
description = "A quality-gated agent for preparing high-value open source contributions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "autocontribute contributors" }]
keywords = ["agents", "github", "open-source", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "httpx>=0.28.1,<1",
  "openai>=2.45.0,<3",
  "packaging>=24.2,<27",
  "pydantic>=2.11.0,<3",
  "PyYAML>=6.0.2,<7",
  "rich>=14.0.0,<15",
  "typer>=0.16.0,<1",
]

[project.optional-dependencies]
dev = [
  "hatchling==1.31.0",
  "mypy>=1.15.0,<2",
  "pytest>=8.3.0,<10",
  "pytest-cov>=6.1.0,<8",
  "respx>=0.22.0,<1",
  "ruff>=0.11.0,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
autocontribute = "autocontribute.cli:app"

[project.urls]
Homepage = "https://github.com/Damadimo/autocontribute"
Issues = "https://github.com/Damadimo/autocontribute/issues"

[tool.uv]
# Dependency-update PRs may advance this snapshot only to a timestamp at least seven days old.
exclude-newer = "2026-07-15T00:00:00Z"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/autocontribute"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["autocontribute"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["autocontribute"]
warn_unreachable = true
