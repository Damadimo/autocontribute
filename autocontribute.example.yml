# Copy this file to autocontribute.yml. Never put API keys or GitHub tokens here: set
# OPENAI_API_KEY or ANTHROPIC_API_KEY, and sign in with `gh auth login` or set the variable
# named by github.token_env. Every key and its default: docs/configuration.md.
identity:  # empty = your GitHub login and its noreply email address
  name: ""
  email: ""

github:
  auth: gh
  token_env: AUTOCONTRIBUTE_GITHUB_TOKEN
  repositories:
    - your-org/your-repo
  owners: []
  include_labels: ["help wanted", "bug", "confirmed", "accepted", "status: help wanted",
                   "contributions welcome", "pr welcome"]
  exclude_labels: ["security", "breaking change", "needs-*", "question", "discussion", "design",
                   "rfc", "proposal", "wontfix", "duplicate", "invalid", "stale", "blocked",
                   "good first issue", "first-timers-only", "beginner"]  # * matches any text
  labels: {}  # per repository: {owner/repo: {include: [...], exclude: [...]}}
  min_stars: 0
  require_unassigned: true
  max_repository_inactivity_days: 180

models:
  # auto: Anthropic models when ANTHROPIC_API_KEY is set, otherwise OpenAI models. Or name a
  # model from the table in docs/configuration.md, such as gpt-5.6-sol or claude-opus-5-5.
  agent: auto
  critic: auto   # auto = the agent's model, or the other provider's when both keys are set
  setup: auto
  triage: auto
  effort: {}     # per role, such as {agent: xhigh}

# Per repository, only where detection gets the test environment wrong:
environments: {}
#   your-org/your-repo:
#     image: python:3.12-bookworm
#     setup: ["pip install -e .[test]"]   # runs with network, through an allowlisting proxy
#     test: python -m pytest -q          # runs offline
#     allow_hosts: []                    # hosts the setup proxy allows beyond package registries

sandbox:
  command_timeout_seconds: 900
  memory: 6g
  cpus: 2
  pids_limit: 1024

policy:
  require_maintainer_signal: true
  require_contribution_guidelines: true
  allow_security_issues: false
  allow_dependency_changes: false
  allow_workflow_changes: false
  # Never hand-author broad legal assent. If a configured repository requires a CLA/DCO, run
  # `autocontribute policy inspect owner/repository`, then the explicitly confirmed `policy attest`
  # command. It emits one repository-scoped record bound to the stable legal-policy digest.
  legal_attestations: {}
  # {version} and {model} are filled in when the change is prepared.
  ai_disclosure: >-
    AI assistance: an AI coding agent (autocontribute {version}, {model}) drafted this change
    and its test and ran the tests listed above in a sandbox. I reviewed the diff and the test
    results before opening this PR and will handle the review.

quality:
  max_files_changed: 8
  max_changed_lines: 400
  max_source_files: 3    # files that are not tests
  max_source_lines: 150

publishing:
  login: ""                        # empty = the GitHub token's account
  head_strategy: auto              # auto | fork
  approval_expires_hours: 72
  draft: false
  ready_for_review: true           # applies only when draft is true
  # Daily/cooldown capacity is durably reserved in the SQLite store before GitHub mutation.
  # Never delete or roll back state to reclaim a failed or ambiguous attempt's reservation.
  max_new_pull_requests_per_day: 1
  max_open_pull_requests: 3
  repository_cooldown_days: 7

budget:                            # in US dollars, at the list prices of the model table
  max_cost_usd_per_run: 10
  max_cost_usd_per_day: 25
  max_model_calls_per_run: 200
  max_run_minutes: 90
  max_candidates_per_run: 25

storage:
  path: .autocontribute  # with Colima on macOS, keep it under your home directory
