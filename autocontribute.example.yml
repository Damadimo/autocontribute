# Copy this file to autocontribute.yml. Never put API keys or GitHub tokens here.
identity:
  name: "Your Name"
  email: "your-handle@users.noreply.github.com"

github:
  auth: gh
  token_env: AUTOCONTRIBUTE_GITHUB_TOKEN
  repositories:
    - facebookresearch/hydra
    - google/python-fire
    - NVIDIA-NeMo/Guardrails
  owners: []
  include_labels: ["help wanted", "good first issue"]
  exclude_labels: ["security", "breaking change", "needs design", "blocked", "discussion"]
  min_stars: 1000
  require_unassigned: true
  max_repository_inactivity_days: 180

models:
  scout: &builder_model
    provider: openai
    model: gpt-5.6
    # Required for `publishing.mode: auto`: copy the exact immutable model ID returned by the API.
    # expected_response_model: gpt-5.6-YYYY-MM-DD
    # immutable_response_model_attested: true  # only after verifying the provider contract
    api_key_env: OPENAI_API_KEY
    reasoning_effort: high
    reasoning_mode: standard
    max_input_tokens: 500000
    max_output_tokens: 40000
    timeout_seconds: 900
    # Conservative price ceilings, not a built-in price table. Verify for the selected model.
    pricing:
      input_usd_per_million_tokens: 10
      cached_input_usd_per_million_tokens: 10
      cache_write_usd_per_million_tokens: 10
      output_usd_per_million_tokens: 100
  builder: *builder_model
  critic:
    <<: *builder_model
    reasoning_mode: pro

sandbox:
  backend: docker
  image: >-
    python:3.12-bookworm@sha256:9bed8554e926c07c6f908841d5ee88c33e8df9236b191526bbce81a9062ab43a
  network: none
  command_timeout_seconds: 900
  memory: 4g
  cpus: 2

validation:
  # These commands are operator-owned and mandatory. Replace them with each repository's canonical
  # checks and use a digest-pinned image that already contains the required toolchain/dependencies.
  required_commands:
    facebookresearch/hydra:
      - python -m pytest
    google/python-fire:
      - python -m pytest
    nvidia-nemo/guardrails:
      - python -m pytest

policy:
  require_maintainer_signal: true
  require_contribution_guidelines: true
  allow_security_issues: false
  allow_dependency_changes: false
  allow_workflow_changes: false
  # Never hand-author broad legal assent. If a configured repository requires a CLA/DCO, run
  # `autocontribute policy inspect owner/repository`, then the explicitly confirmed `policy attest`
  # command. It emits one repository-scoped record bound to the stable legal-policy digest.
  legal_attestations: {}
  ai_disclosure: >-
    This contribution was prepared autonomously by an AI agent. Its validation
    evidence comes from Autocontribute's configured automated checks; no human
    review is implied.

quality:
  min_candidate_score: 85
  min_readiness_score: 90
  min_dimension_score: 80
  max_files_changed: 8
  max_changed_lines: 400
  require_validation_commands: true
  require_regression_evidence_for_bugfix: true

publishing:
  mode: review_required # guarded `auto` is limited to the one configured repository
  approval_expires_hours: 24
  draft: true
  # Daily/cooldown capacity is durably reserved in schema-v5 SQLite before GitHub mutation.
  # Never delete or roll back state to reclaim a failed or ambiguous attempt's reservation.
  max_new_pull_requests_per_day: 1
  max_open_pull_requests: 2
  repository_cooldown_days: 7
  auto_publish_env: AUTOCONTRIBUTE_ALLOW_AUTO_PUBLISH

budget:
  max_model_calls_per_run: 6
  max_candidates_per_run: 25
  max_input_tokens_per_run: 3000000
  max_output_tokens_per_run: 240000
  max_model_seconds_per_run: 3600
  max_model_cost_usd_per_run: 50

storage:
  path: .autocontribute
