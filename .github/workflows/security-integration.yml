name: Security integration

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-integration-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  classify-security-changes:
    name: Classify security integration changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_live: ${{ steps.classify.outputs.run_live }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the complete local diff
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail

          is_full_sha() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]]
          }

          commit_exists() {
            git cat-file -e "${1}^{commit}" 2>/dev/null
          }

          run_live=true
          reason=event_requires_live
          diff_base=""
          diff_head=""

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PULL_REQUEST_BASE_SHA"
              head_sha="$PULL_REQUEST_HEAD_SHA"
              if ! is_full_sha "$base_sha" || ! is_full_sha "$head_sha"; then
                reason=invalid_pull_request_sha
              elif ! commit_exists "$base_sha" || ! commit_exists "$head_sha"; then
                reason=missing_pull_request_commit
              elif ! merge_base="$(git merge-base "$base_sha" "$head_sha" 2>/dev/null)"; then
                reason=missing_pull_request_merge_base
              elif ! is_full_sha "$merge_base" || ! commit_exists "$merge_base"; then
                reason=invalid_pull_request_merge_base
              else
                diff_base="$merge_base"
                diff_head="$head_sha"
              fi
              ;;
            push)
              # Always test main, even when the immediate push contains only
              # documentation. SHA-keyed concurrency prevents a different tree
              # from displacing this run while it is pending.
              reason=push_requires_live
              ;;
            merge_group)
              reason=merge_group_requires_live
              ;;
          esac

          if [[ -n "$diff_base" && -n "$diff_head" ]]; then
            changed_paths_file="$(mktemp \
              "${RUNNER_TEMP}/security-integration-paths.XXXXXX")"
            trap 'rm -f -- "$changed_paths_file"' EXIT
            if ! git diff --no-renames --name-only -z \
              "$diff_base" "$diff_head" -- >"$changed_paths_file"; then
              reason=diff_failed
            elif [[ ! -s "$changed_paths_file" ]]; then
              reason=empty_diff
            else
              run_live=false
              reason=documentation_only
              while IFS= read -r -d '' changed_path; do
                case "$changed_path" in
                  docs/* | README.md | CONTRIBUTING.md | SECURITY.md | LICENSE)
                    ;;
                  *)
                    run_live=true
                    reason=security_relevant_changes
                    break
                    ;;
                esac
              done <"$changed_paths_file"
            fi
          fi

          printf 'Security integration classification: run_live=%s reason=%s\n' \
            "$run_live" "$reason"
          {
            printf 'run_live=%s\n' "$run_live"
            printf 'reason=%s\n' "$reason"
          } >>"$GITHUB_OUTPUT"

  live-docker-isolation:
    name: Live Docker isolation (rootful)
    needs: classify-security-changes
    if: >-
      ${{
        !cancelled() &&
        (
          needs.classify-security-changes.result != 'success' ||
          needs.classify-security-changes.outputs.run_live != 'false'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Preload pinned sandbox image on rootful Docker
        run: |
          image="$(uv run python -c 'from autocontribute.config import SandboxConfig; print(SandboxConfig().image)')"
          docker pull "$image"
      - name: Exercise live rootful Docker isolation
        env:
          AUTOCONTRIBUTE_RUN_DOCKER_TESTS: "1"
        run: >-
          uv run pytest -q tests/test_sandbox_live.py tests/test_environments_live.py
          tests/test_agent_loop_live.py

  security-integration-gate:
    name: Security integration gate
    needs: [classify-security-changes, live-docker-isolation]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce the security integration result
        shell: bash
        env:
          CLASSIFIER_RESULT: ${{ needs.classify-security-changes.result }}
          RUN_LIVE: ${{ needs.classify-security-changes.outputs.run_live }}
          LIVE_RESULT: ${{ needs.live-docker-isolation.result }}
        run: |
          set -euo pipefail

          if [[
            "$CLASSIFIER_RESULT" == success &&
            "$RUN_LIVE" == false &&
            "$LIVE_RESULT" == skipped
          ]]; then
            printf '%s\n' 'Security integration safely skipped for documentation-only changes.'
            exit 0
          fi

          if [[
            "$CLASSIFIER_RESULT" == success &&
            "$RUN_LIVE" == true &&
            "$LIVE_RESULT" == success
          ]]; then
            printf '%s\n' 'Live security integration passed.'
            exit 0
          fi

          printf '%s\n' \
            'Security integration did not satisfy the fail-closed result contract.' >&2
          printf 'classifier=%s run_live=%s live=%s\n' \
            "$CLASSIFIER_RESULT" "$RUN_LIVE" "$LIVE_RESULT" >&2
          exit 1
