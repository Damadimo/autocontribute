name: Security integration

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-docker-isolation:
    name: Live Docker isolation (${{ matrix.docker_mode }})
    strategy:
      fail-fast: false
      matrix:
        docker_mode: [rootful, rootless]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Preload pinned sandbox image on rootful Docker
        if: matrix.docker_mode == 'rootful'
        run: |
          image="$(uv run python -c 'from autocontribute.config import SandboxConfig; print(SandboxConfig().image)')"
          docker pull "$image"
      - name: Exercise live rootful Docker isolation
        if: matrix.docker_mode == 'rootful'
        env:
          AUTOCONTRIBUTE_RUN_DOCKER_TESTS: "1"
        run: uv run pytest -q tests/test_sandbox_live.py
      - name: Exercise live rootless Docker production topology
        if: matrix.docker_mode == 'rootless'
        env:
          AUTOCONTRIBUTE_RUN_DOCKER_TESTS: "1"
        run: |
          set -Eeuo pipefail

          account=autocontribute
          service_home=/var/lib/autocontribute
          system_unit=autocontribute-rootless-docker.service
          user_unit=autocontribute-rootless-docker-daemon.service
          system_fragment=/etc/systemd/system/autocontribute-rootless-docker.service
          user_fragment=/etc/systemd/user/autocontribute-rootless-docker-daemon.service
          manager_drop_in=""
          manager_drop_in_directory=""
          expected_unit_path=/etc/systemd/user:/run/systemd/user:/usr/local/lib/systemd/user:/usr/lib/systemd/user
          expected_manager_unit_path='/etc/systemd/user /run/systemd/user /usr/local/lib/systemd/user /usr/lib/systemd/user'
          runtime=/run/autocontribute
          docker_socket=/run/autocontribute/docker.sock
          rootful_socket=/var/run/docker.sock
          docker_apt_key=/etc/apt/keyrings/autocontribute-rootless-docker.asc
          docker_apt_source=/etc/apt/sources.list.d/autocontribute-rootless-docker.list
          data_image=""
          loop_device=""
          service_uid=""
          service_gid=""
          smoke_root=""
          account_created=0
          data_mounted=0
          fixture_preflight_complete=0
          manager_drop_in_preflight_complete=0
          service_home_created=0
          topology_installed=0

          show_rootless_diagnostics() {
            sudo systemctl --no-pager --full status "$system_unit" 2>/dev/null || true
            sudo journalctl --no-pager -n 200 -u "$system_unit" 2>/dev/null || true
            if [[ -n "$service_uid" ]] && \
               sudo test -S "/run/user/${service_uid}/bus"; then
              sudo -u "$account" env \
                HOME="$service_home" \
                XDG_RUNTIME_DIR="/run/user/${service_uid}" \
                DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${service_uid}/bus" \
                systemctl --user --no-pager --full status "$user_unit" \
                2>/dev/null || true
              sudo -u "$account" env \
                HOME="$service_home" \
                XDG_RUNTIME_DIR="/run/user/${service_uid}" \
                DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${service_uid}/bus" \
                journalctl --user --no-pager -n 200 -u "$user_unit" \
                2>/dev/null || true
              sudo journalctl --no-pager --full -n 200 \
                "_SYSTEMD_USER_UNIT=$user_unit" 2>/dev/null || true
              sudo journalctl --no-pager --full -n 200 \
                SYSLOG_IDENTIFIER=autocontribute-rootless-dockerd \
                2>/dev/null || true
            fi
          }

          rootless_error() {
            local exit_status=$?
            printf 'Rootless Docker production-topology integration failed at line %s\n' \
              "${BASH_LINENO[0]:-unknown}" >&2
            show_rootless_diagnostics
            exit "$exit_status"
          }

          cleanup_rootless_job() {
            local exit_status=$?
            local cleanup_failed=0
            local mount_detached=1
            trap - ERR EXIT
            set +e

            if [[ "$topology_installed" -eq 1 ]]; then
              if ! sudo systemctl stop "$system_unit" 2>/dev/null; then
                sudo systemctl kill --kill-whom=all --signal=KILL "$system_unit" \
                  2>/dev/null || true
                cleanup_failed=1
              fi
            fi
            if [[ -n "$service_uid" ]]; then
              if sudo test -S "/run/user/${service_uid}/bus"; then
                sudo -u "$account" env \
                  HOME="$service_home" \
                  XDG_RUNTIME_DIR="/run/user/${service_uid}" \
                  DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${service_uid}/bus" \
                  systemctl --user stop "$user_unit" 2>/dev/null || true
              fi
              sudo systemctl stop "user@${service_uid}.service" 2>/dev/null || true
            fi
            if [[ "$account_created" -eq 1 ]]; then
              sudo loginctl disable-linger "$account" 2>/dev/null || true
            fi

            if [[ "$data_mounted" -eq 1 ]] && \
               sudo mountpoint --quiet -- "$service_home/docker"; then
              if sudo umount -- "$service_home/docker"; then
                data_mounted=0
              else
                printf '%s\n' 'Failed to unmount the live rootless Docker data root' >&2
                cleanup_failed=1
                mount_detached=0
              fi
            fi
            if [[ "$mount_detached" -eq 1 && -n "$loop_device" ]]; then
              if sudo losetup --detach "$loop_device"; then
                loop_device=""
              else
                printf '%s\n' 'Failed to detach the live rootless Docker loop device' >&2
                cleanup_failed=1
                mount_detached=0
              fi
            fi

            if [[ "$fixture_preflight_complete" -eq 1 ]]; then
              sudo rm -f -- \
                /etc/systemd/system/autocontribute-failure@.service \
                "$system_fragment" \
                "$user_fragment" \
                /etc/autocontribute/rootless-docker-daemon.json \
                /usr/local/libexec/autocontribute-docker-data-check \
                /usr/local/libexec/autocontribute-record-failure \
                /usr/local/libexec/autocontribute-rootless-docker \
                /usr/local/libexec/autocontribute-rootless-docker-check \
                /usr/local/libexec/autocontribute-rootless-dockerd \
                /opt/autocontribute/current/.venv/bin/autocontribute \
                "$docker_apt_source" \
                "$docker_apt_key"
              sudo rmdir --ignore-fail-on-non-empty \
                /etc/autocontribute \
                /opt/autocontribute/current/.venv/bin \
                /opt/autocontribute/current/.venv \
                /opt/autocontribute/current \
                /opt/autocontribute 2>/dev/null || true
            fi
            if [[ "$manager_drop_in_preflight_complete" -eq 1 ]]; then
              sudo rm -f -- "$manager_drop_in"
              sudo rmdir --ignore-fail-on-non-empty \
                "$manager_drop_in_directory" 2>/dev/null || true
            fi
            sudo systemctl daemon-reload 2>/dev/null || cleanup_failed=1

            if [[ "$account_created" -eq 1 ]]; then
              sudo userdel "$account" 2>/dev/null || cleanup_failed=1
              account_created=0
            fi
            if [[ "$mount_detached" -eq 1 && \
                  "$service_home_created" -eq 1 && -d "$service_home" ]]; then
              sudo rm -rf -- "$service_home"
              service_home_created=0
            fi
            if [[ "$mount_detached" -eq 1 && -n "$data_image" ]]; then
              rm -f -- "$data_image" || cleanup_failed=1
            fi
            if [[ "$mount_detached" -eq 1 && -n "$smoke_root" && -d "$smoke_root" ]]; then
              rmdir -- "$smoke_root" 2>/dev/null || cleanup_failed=1
            fi
            if [[ "$exit_status" -eq 0 && "$cleanup_failed" -ne 0 ]]; then
              exit_status=1
            fi
            exit "$exit_status"
          }
          trap rootless_error ERR
          trap cleanup_rootless_job EXIT

          test "$(cat /proc/1/comm)" = systemd
          test "$(stat --file-system --format=%T /sys/fs/cgroup)" = cgroup2fs
          if getent passwd "$account" >/dev/null || getent group "$account" >/dev/null; then
            printf '%s\n' 'The production-topology fixture account already exists' >&2
            exit 1
          fi
          for fixture_path in \
            "$service_home" \
            "$system_fragment" \
            "$user_fragment" \
            /etc/systemd/system/autocontribute-failure@.service \
            /etc/systemd/system/user@.service.d/50-autocontribute.conf \
            /etc/autocontribute \
            /etc/autocontribute/rootless-docker-daemon.json \
            /usr/local/libexec/autocontribute-docker-data-check \
            /usr/local/libexec/autocontribute-record-failure \
            /usr/local/libexec/autocontribute-rootless-docker \
            /usr/local/libexec/autocontribute-rootless-docker-check \
            /usr/local/libexec/autocontribute-rootless-dockerd \
            "$docker_apt_key" \
            "$docker_apt_source" \
            /opt/autocontribute \
            /opt/autocontribute/current/.venv/bin/autocontribute; do
            if sudo test -e "$fixture_path" || sudo test -L "$fixture_path"; then
              printf 'Production-topology fixture path already exists: %s\n' \
                "$fixture_path" >&2
              exit 1
            fi
          done
          unset fixture_path
          fixture_preflight_complete=1

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates curl dbus-user-session e2fsprogs fuse-overlayfs \
            gnupg slirp4netns uidmap

          docker_package_version="$(
            dpkg-query --show --showformat='${Version}' docker-ce 2>/dev/null
          )"
          docker_cli_version="$(
            dpkg-query --show --showformat='${Version}' docker-ce-cli 2>/dev/null
          )"
          test -n "$docker_package_version"
          test "$docker_cli_version" = "$docker_package_version"

          docker_key="${RUNNER_TEMP}/docker-release.asc"
          gpg_home="${RUNNER_TEMP}/autocontribute-gpg"
          install -d -m 0700 "$gpg_home"
          curl --fail --location --proto '=https' --show-error --silent --tlsv1.2 \
            https://download.docker.com/linux/ubuntu/gpg \
            --output "$docker_key"
          key_metadata="$(
            gpg --batch --no-options --homedir "$gpg_home" \
              --show-keys --with-colons "$docker_key"
          )"
          key_count="$(
            awk -F: '$1 == "pub" { count += 1 } END { print count + 0 }' \
              <<<"$key_metadata"
          )"
          key_fingerprint="$(
            awk -F: '$1 == "fpr" { print $10; exit }' <<<"$key_metadata"
          )"
          test "$key_count" = 1
          test "$key_fingerprint" = 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

          architecture="$(dpkg --print-architecture)"
          . /etc/os-release
          test "${ID:-}" = ubuntu
          test "${VERSION_CODENAME:-}" = noble
          test "$architecture" = amd64
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "$docker_key" "$docker_apt_key"
          printf '%s\n' \
            "deb [arch=${architecture} signed-by=${docker_apt_key}] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" \
            | sudo tee "$docker_apt_source" >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "docker-ce-rootless-extras=${docker_package_version}"
          installed_extras_version="$(
            dpkg-query --show --showformat='${Version}' docker-ce-rootless-extras
          )"
          test "$installed_extras_version" = "$docker_package_version"
          for command_name in \
            docker dockerd-rootless.sh fallocate findmnt fuse-overlayfs losetup \
            mkfs.ext4 mount mountpoint newgidmap newuidmap rootlesskit setsid \
            slirp4netns umount; do
            if ! command -v "$command_name" >/dev/null; then
              printf 'Required rootless command is unavailable: %s\n' "$command_name" >&2
              exit 1
            fi
          done
          unset command_name

          sudo useradd --system --user-group --no-create-home --home-dir "$service_home" \
            --shell /usr/sbin/nologin "$account"
          account_created=1
          service_uid="$(id --user "$account")"
          service_gid="$(id --group "$account")"
          [[ "$service_uid" =~ ^[1-9][0-9]*$ ]]
          [[ "$service_gid" =~ ^[1-9][0-9]*$ ]]
          manager_drop_in_directory="/etc/systemd/system/user@${service_uid}.service.d"
          manager_drop_in="${manager_drop_in_directory}/50-autocontribute.conf"
          if sudo test -e "$manager_drop_in_directory" || \
             sudo test -L "$manager_drop_in_directory"; then
            printf 'Production-topology fixture path already exists: %s\n' \
              "$manager_drop_in_directory" >&2
            exit 1
          fi
          manager_drop_in_preflight_complete=1

          subordinate_range="$(
            AUTOCONTRIBUTE_ACCOUNT="$account" python3 - <<'PY'
          import os
          from pathlib import Path

          account = os.environ["AUTOCONTRIBUTE_ACCOUNT"]

          def ranges(path: str) -> list[tuple[str, int, int]]:
              parsed = []
              for raw_line in Path(path).read_text(encoding="utf-8").splitlines():
                  name, start, count = raw_line.split(":")
                  parsed.append((name, int(start), int(count)))
              return parsed

          uid_ranges = ranges("/etc/subuid")
          gid_ranges = ranges("/etc/subgid")
          uid_owned = {(start, count) for name, start, count in uid_ranges if name == account}
          gid_owned = {(start, count) for name, start, count in gid_ranges if name == account}
          existing = sorted(
              (start, count)
              for start, count in uid_owned & gid_owned
              if count >= 65_536
          )
          if existing:
              start, count = existing[0]
              print(f"existing:{start}:{count}")
              raise SystemExit

          occupied = [(start, start + count) for _, start, count in uid_ranges + gid_ranges]
          count = 65_536
          for start in range(1_048_576, 16_777_216, count):
              end = start + count
              if all(end <= used_start or start >= used_end for used_start, used_end in occupied):
                  print(f"new:{start}:{count}")
                  raise SystemExit
          raise SystemExit("no shared subordinate UID/GID range is available")
          PY
          )"
          IFS=: read -r range_action range_start range_count <<<"$subordinate_range"
          [[ "$range_start" =~ ^[1-9][0-9]*$ ]]
          [[ "$range_count" =~ ^[1-9][0-9]*$ ]]
          if [[ "$range_action" == new ]]; then
            range_end="$((range_start + range_count - 1))"
            sudo usermod \
              --add-subuids "${range_start}-${range_end}" \
              --add-subgids "${range_start}-${range_end}" \
              "$account"
          elif [[ "$range_action" != existing ]]; then
            printf '%s\n' 'Invalid subordinate-range selection' >&2
            exit 1
          fi
          for subordinate_file in /etc/subuid /etc/subgid; do
            awk -F: -v account="$account" -v start="$range_start" -v count="$range_count" \
              '$1 == account && $2 == start && $3 == count { found += 1 }
               END { exit found != 1 }' \
              "$subordinate_file"
          done
          unset subordinate_file

          sudo systemctl stop docker.service docker.socket
          if sudo systemctl is-active --quiet docker.service || \
             sudo systemctl is-active --quiet docker.socket; then
            printf '%s\n' 'Rootful Docker units remained active after shutdown' >&2
            exit 1
          fi
          if docker --host unix://$rootful_socket info >/dev/null 2>&1; then
            printf '%s\n' 'Rootful Docker remained reachable after shutdown' >&2
            exit 1
          fi
          sudo rm -f -- "$rootful_socket"
          sudo test ! -e "$rootful_socket"

          sudo install -d -o root -g "$account" -m 0750 "$service_home"
          service_home_created=1
          sudo install -d -o "$account" -g "$account" -m 0700 \
            "$service_home/tmp" "$service_home/health"
          sudo install -d -o "$account" -g "$account" -m 0710 \
            "$service_home/docker"
          test "$(stat --format=%u:%g:%a "$service_home")" = \
            "0:${service_gid}:750"

          smoke_root="$(mktemp --directory \
            "${RUNNER_TEMP}/autocontribute-rootless-topology.XXXXXX")"
          smoke_root="$(realpath "$smoke_root")"
          data_image="${smoke_root}/docker.ext4"
          fallocate --length 4G "$data_image"
          loop_device="$(sudo losetup --find --show "$data_image")"
          [[ "$loop_device" =~ ^/dev/loop[0-9]+$ ]]
          sudo mkfs.ext4 -q -m 0 -N 131072 "$loop_device"
          sudo mount -t ext4 -o nodev,nosuid -- \
            "$loop_device" "$service_home/docker"
          data_mounted=1
          sudo chown "$account:$account" "$service_home/docker"
          sudo chmod 0710 "$service_home/docker"
          test "$(sudo stat --format=%u:%g:%a "$service_home/docker")" = \
            "${service_uid}:${service_gid}:710"
          home_entries_before="$(sudo find "$service_home" \
            -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          test "$home_entries_before" = $'docker\nhealth\ntmp'

          sudo install -d -o root -g "$account" -m 0750 /etc/autocontribute
          printf '%s\n' \
            '{' \
            '  "storage-driver": "fuse-overlayfs"' \
            '}' \
            | sudo install -o root -g "$account" -m 0640 \
                /dev/stdin /etc/autocontribute/rootless-docker-daemon.json
          sudo python3 -m json.tool \
            /etc/autocontribute/rootless-docker-daemon.json >/dev/null

          sudo install -d -o root -g root -m 0755 \
            /usr/local/libexec \
            "$manager_drop_in_directory" \
            /etc/systemd/user \
            /opt/autocontribute/current/.venv/bin
          sudo install -o root -g root -m 0755 \
            deploy/systemd/libexec/autocontribute-docker-data-check \
            deploy/systemd/libexec/autocontribute-record-failure \
            deploy/systemd/libexec/autocontribute-rootless-docker \
            deploy/systemd/libexec/autocontribute-rootless-docker-check \
            deploy/systemd/libexec/autocontribute-rootless-dockerd \
            /usr/local/libexec/
          sudo install -o root -g root -m 0755 \
            /usr/bin/true /opt/autocontribute/current/.venv/bin/autocontribute
          sudo install -o root -g root -m 0644 \
            deploy/systemd/autocontribute-failure@.service \
            deploy/systemd/autocontribute-rootless-docker.service \
            /etc/systemd/system/
          sudo install -o root -g root -m 0644 \
            deploy/systemd/user/autocontribute-rootless-docker-daemon.service \
            "$user_fragment"
          sudo install -o root -g root -m 0644 \
            deploy/systemd/autocontribute-user-manager.conf \
            "$manager_drop_in"
          topology_installed=1

          cmp --silent deploy/systemd/autocontribute-rootless-docker.service \
            "$system_fragment"
          cmp --silent \
            deploy/systemd/user/autocontribute-rootless-docker-daemon.service \
            "$user_fragment"
          cmp --silent deploy/systemd/autocontribute-user-manager.conf \
            "$manager_drop_in"
          test "$(stat --format=%U:%G:%a "$system_fragment")" = root:root:644
          test "$(stat --format=%U:%G:%a "$user_fragment")" = root:root:644
          test "$(stat --format=%U:%G:%a "$manager_drop_in")" = root:root:644

          sudo loginctl enable-linger "$account"
          sudo systemctl daemon-reload
          sudo systemctl restart "user@${service_uid}.service"
          user_runtime="/run/user/${service_uid}"
          user_bus="${user_runtime}/bus"
          user_manager_ready=0
          user_manager_readiness_timeout_seconds=20
          user_manager_readiness_probe_seconds=3
          user_manager_readiness_kill_grace_seconds=1
          user_manager_readiness_deadline=$((
            SECONDS + user_manager_readiness_timeout_seconds
          ))
          while (( SECONDS < user_manager_readiness_deadline )); do
            user_manager_readiness_remaining=$((
              user_manager_readiness_deadline - SECONDS
            ))
            if ((
              user_manager_readiness_remaining <=
                user_manager_readiness_kill_grace_seconds
            )); then
              break
            fi
            user_manager_readiness_probe_timeout=$user_manager_readiness_probe_seconds
            if ((
              user_manager_readiness_probe_timeout +
                  user_manager_readiness_kill_grace_seconds >
                user_manager_readiness_remaining
            )); then
              user_manager_readiness_probe_timeout=$((
                user_manager_readiness_remaining -
                  user_manager_readiness_kill_grace_seconds
              ))
            fi
            if sudo test -S "$user_bus" && \
               timeout \
                 --kill-after="${user_manager_readiness_kill_grace_seconds}s" \
                 "${user_manager_readiness_probe_timeout}s" \
               sudo -u "$account" env \
                 HOME="$service_home" \
                 XDG_RUNTIME_DIR="$user_runtime" \
                 DBUS_SESSION_BUS_ADDRESS="unix:path=$user_bus" \
                 systemctl --user show-environment >/dev/null 2>&1; then
              user_manager_readiness_remaining=$((
                user_manager_readiness_deadline - SECONDS
              ))
              if ((
                user_manager_readiness_remaining >
                  user_manager_readiness_kill_grace_seconds
              )); then
                user_manager_readiness_probe_timeout=$user_manager_readiness_probe_seconds
                if ((
                  user_manager_readiness_probe_timeout +
                      user_manager_readiness_kill_grace_seconds >
                    user_manager_readiness_remaining
                )); then
                  user_manager_readiness_probe_timeout=$((
                    user_manager_readiness_remaining -
                      user_manager_readiness_kill_grace_seconds
                  ))
                fi
                if user_manager_owner="$(
                  timeout \
                    --kill-after="${user_manager_readiness_kill_grace_seconds}s" \
                    "${user_manager_readiness_probe_timeout}s" \
                    sudo -u "$account" env \
                      HOME="$service_home" \
                      XDG_RUNTIME_DIR="$user_runtime" \
                      DBUS_SESSION_BUS_ADDRESS="unix:path=$user_bus" \
                      busctl --user --no-pager call \
                        org.freedesktop.DBus /org/freedesktop/DBus \
                        org.freedesktop.DBus GetConnectionUnixProcessID \
                        s org.freedesktop.systemd1 \
                        2>/dev/null
                )" && [[ "$user_manager_owner" =~ ^u[[:space:]][1-9][0-9]*$ ]]; then
                  user_manager_ready=1
                  break
                fi
              fi
            fi
            if (( SECONDS < user_manager_readiness_deadline )); then
              sleep 0.5
            fi
          done
          test "$user_manager_ready" -eq 1
          unset \
            user_manager_owner user_manager_readiness_deadline \
            user_manager_readiness_kill_grace_seconds \
            user_manager_readiness_probe_seconds \
            user_manager_readiness_probe_timeout \
            user_manager_readiness_remaining \
            user_manager_readiness_timeout_seconds user_manager_ready
          test "$(stat --format=%u:%g:%a "$user_runtime")" = \
            "${service_uid}:${service_gid}:700"
          test "$(sudo stat --format=%u:%g "$user_bus")" = \
            "${service_uid}:${service_gid}"

          manager_unit="user@${service_uid}.service"
          manager_drop_ins="$(sudo systemctl show "$manager_unit" \
            --property=DropInPaths --value)"
          read -r -a manager_drop_in_paths <<<"$manager_drop_ins"
          expected_manager_drop_ins=(
            /usr/lib/systemd/system/user@.service.d/10-login-barrier.conf
            "$manager_drop_in"
            /usr/lib/systemd/system/user@.service.d/timeout.conf
          )
          test "${#manager_drop_in_paths[@]}" -eq \
            "${#expected_manager_drop_ins[@]}"
          for expected_manager_drop_in in "${expected_manager_drop_ins[@]}"; do
            manager_drop_in_count=0
            for manager_drop_in_path in "${manager_drop_in_paths[@]}"; do
              if [[ "$manager_drop_in_path" == "$expected_manager_drop_in" ]]; then
                manager_drop_in_count=$((manager_drop_in_count + 1))
              fi
            done
            test "$manager_drop_in_count" -eq 1
            test "$(stat --format=%U:%G:%a "$expected_manager_drop_in")" = \
              root:root:644
          done
          unset expected_manager_drop_in manager_drop_in_count manager_drop_in_path
          test "$(sudo systemctl show "$manager_unit" \
            --property=Delegate --value)" = yes
          test "$(sudo systemctl show "$manager_unit" \
            --property=Transient --value)" = no
          test "$(sudo systemctl show "$manager_unit" \
            --property=FragmentPath --value)" = \
            /usr/lib/systemd/system/user@.service
          test "$(stat --format=%U:%G:%a \
            /usr/lib/systemd/system/user@.service)" = root:root:644
          test "$(sudo systemctl show "$manager_unit" \
            --property=Environment --value)" = \
            "SYSTEMD_UNIT_PATH=$expected_unit_path"
          manager_cgroup="$(sudo systemctl show "$manager_unit" \
            --property=ControlGroup --value)"
          test "$manager_cgroup" = \
            "/user.slice/user-${service_uid}.slice/user@${service_uid}.service"
          for controller in cpu cpuset io memory pids; do
            grep --word-regexp --quiet "$controller" \
              "/sys/fs/cgroup${manager_cgroup}/cgroup.controllers"
          done
          unset controller

          user_systemctl=(
            sudo -u "$account" env
            "HOME=$service_home"
            "XDG_RUNTIME_DIR=$user_runtime"
            "DBUS_SESSION_BUS_ADDRESS=unix:path=$user_bus"
            systemctl --user
          )
          "${user_systemctl[@]}" daemon-reload
          manager_effective_unit_path="$("${user_systemctl[@]}" show \
            --property=UnitPath --value)"
          test "$manager_effective_unit_path" = "$expected_manager_unit_path"
          test "$("${user_systemctl[@]}" show "$user_unit" \
            --property=FragmentPath --value)" = "$user_fragment"
          test -z "$("${user_systemctl[@]}" show "$user_unit" \
            --property=DropInPaths --value)"
          test "$("${user_systemctl[@]}" show "$user_unit" \
            --property=Transient --value)" = no

          manager_pid_before="$(sudo systemctl show "$manager_unit" \
            --property=MainPID --value)"
          [[ "$manager_pid_before" =~ ^[1-9][0-9]*$ ]]
          bus_response="$(sudo -u "$account" env \
            HOME="$service_home" \
            XDG_RUNTIME_DIR="$user_runtime" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=$user_bus" \
            busctl --user --no-pager call \
              org.freedesktop.DBus /org/freedesktop/DBus \
              org.freedesktop.DBus GetConnectionUnixProcessID \
              s org.freedesktop.systemd1)"
          read -r bus_signature bus_pid bus_extra <<<"$bus_response"
          test "$bus_signature" = u
          test "$bus_pid" = "$manager_pid_before"
          test -z "$bus_extra"
          test "$(sudo systemctl show "$manager_unit" \
            --property=MainPID --value)" = "$manager_pid_before"
          sudo -u "$account" test -r "/proc/${manager_pid_before}/status"
          sudo -u "$account" test -r "/proc/${manager_pid_before}/cgroup"
          sudo -u "$account" test -r "/proc/${manager_pid_before}/environ"
          printf 'Rootless user-manager fragment: %s\n' \
            /usr/lib/systemd/system/user@.service
          printf 'Rootless user-manager drop-ins: %s\n' "$manager_drop_ins"
          printf 'Rootless user-manager UnitPath: %s\n' \
            "$manager_effective_unit_path"
          printf 'Rootless user-manager stable PID: %s\n' "$manager_pid_before"

          sudo systemctl start "$system_unit"
          sudo systemctl is-active --quiet "$system_unit"
          test "$(sudo systemctl show "$system_unit" \
            --property=SubState --value)" = running
          test "$(sudo systemctl show "$system_unit" \
            --property=FragmentPath --value)" = "$system_fragment"
          test -z "$(sudo systemctl show "$system_unit" \
            --property=DropInPaths --value)"
          "${user_systemctl[@]}" is-active --quiet "$user_unit"
          test "$("${user_systemctl[@]}" show "$user_unit" \
            --property=SubState --value)" = running
          test "$("${user_systemctl[@]}" show "$user_unit" \
            --property=FragmentPath --value)" = "$user_fragment"
          test -z "$("${user_systemctl[@]}" show "$user_unit" \
            --property=DropInPaths --value)"
          test "$("${user_systemctl[@]}" show "$user_unit" \
            --property=Transient --value)" = no

          test -d "$runtime"
          test ! -L "$runtime"
          test "$(stat --format=%u:%g:%a "$runtime")" = \
            "${service_uid}:${service_gid}:700"
          sudo test -S "$docker_socket"
          sudo test ! -L "$docker_socket"
          test "$(sudo stat --format=%u:%g "$docker_socket")" = \
            "${service_uid}:${service_gid}"
          sudo test ! -e "/run/user/${service_uid}/docker.sock"
          sudo -u "$account" env \
            HOME="$service_home" \
            XDG_RUNTIME_DIR="$runtime" \
            DOCKER_HOST="unix://$docker_socket" \
            /usr/local/libexec/autocontribute-rootless-docker-check \
              "$runtime" "$docker_socket" "$rootful_socket"

          service_env=(
            sudo -u "$account" env
            "HOME=$service_home"
            "TMPDIR=$service_home/tmp"
            "XDG_RUNTIME_DIR=$runtime"
            "DOCKER_HOST=unix://$docker_socket"
            "PATH=$GITHUB_WORKSPACE/.venv/bin:/usr/local/bin:/usr/bin:/bin"
          )

          proxy_pid_before="$(sudo systemctl show "$system_unit" \
            --property=MainPID --value)"
          daemon_pid_before="$("${user_systemctl[@]}" show "$user_unit" \
            --property=MainPID --value)"
          [[ "$proxy_pid_before" =~ ^[1-9][0-9]*$ ]]
          [[ "$daemon_pid_before" =~ ^[1-9][0-9]*$ ]]
          daemon_no_new_privileges="$(sudo sed -n \
            's/^NoNewPrivs:[[:space:]]*//p' \
            "/proc/${daemon_pid_before}/status")"
          test "$daemon_no_new_privileges" = 0
          unset daemon_no_new_privileges
          sudo systemctl reload "$system_unit"
          sudo systemctl is-active --quiet "$system_unit"
          test "$(sudo systemctl show "$system_unit" \
            --property=SubState --value)" = running
          test "$(sudo systemctl show "$system_unit" \
            --property=MainPID --value)" = "$proxy_pid_before"
          test "$(sudo systemctl show "$manager_unit" \
            --property=MainPID --value)" = "$manager_pid_before"
          "${user_systemctl[@]}" is-active --quiet "$user_unit"
          test "$("${user_systemctl[@]}" show "$user_unit" \
            --property=SubState --value)" = running
          test "$("${user_systemctl[@]}" show "$user_unit" \
            --property=MainPID --value)" = "$daemon_pid_before"
          sudo test -S "$docker_socket"
          sudo -u "$account" env \
            HOME="$service_home" \
            XDG_RUNTIME_DIR="$runtime" \
            DOCKER_HOST="unix://$docker_socket" \
            /usr/local/libexec/autocontribute-rootless-docker-check \
              "$runtime" "$docker_socket" "$rootful_socket"
          "${service_env[@]}" docker info >/dev/null

          "${service_env[@]}" "$GITHUB_WORKSPACE/.venv/bin/python" -c \
            'import autocontribute; import autocontribute.cli'
          "${service_env[@]}" "$GITHUB_WORKSPACE/.venv/bin/autocontribute" \
            --help >/dev/null
          git_smoke="$service_home/tmp/git-smoke"
          "${service_env[@]}" install -d -m 0700 "$git_smoke"
          "${service_env[@]}" git init --quiet --initial-branch=main "$git_smoke"
          "${service_env[@]}" git -C "$git_smoke" config --local \
            user.name 'Autocontribute CI'
          "${service_env[@]}" git -C "$git_smoke" config --local \
            user.email autocontribute-ci@example.invalid
          "${service_env[@]}" git -C "$git_smoke" status --short
          test "$("${service_env[@]}" git -C "$git_smoke" config --local \
            --get user.name)" = 'Autocontribute CI'
          home_entries_after="$(sudo find "$service_home" \
            -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          test "$home_entries_after" = "$home_entries_before"
          test "$(stat --format=%u:%g:%a "$service_home")" = \
            "0:${service_gid}:750"
          sudo test ! -e "$service_home/.gitconfig"

          mode="$("${service_env[@]}" "$GITHUB_WORKSPACE/.venv/bin/python" -c \
            'from autocontribute.sandbox import detect_docker_daemon_mode; print(detect_docker_daemon_mode())')"
          test "$mode" = rootless
          test "$("${service_env[@]}" docker info \
            --format '{{.DockerRootDir}}')" = "$service_home/docker"
          test "$("${service_env[@]}" docker info \
            --format '{{.CgroupVersion}}')" = 2
          cgroup_driver="$("${service_env[@]}" docker info \
            --format '{{.CgroupDriver}}')"
          test -n "$cgroup_driver"
          test "$cgroup_driver" != none
          test "$("${service_env[@]}" docker version \
            --format '{{.Client.Version}}')" = \
            "$("${service_env[@]}" docker version --format '{{.Server.Version}}')"
          printf 'Rootless Docker cgroup driver: %s\n' "$cgroup_driver"

          image="$("$GITHUB_WORKSPACE/.venv/bin/python" -c \
            'from autocontribute.config import SandboxConfig; print(SandboxConfig().image)')"
          "${service_env[@]}" docker pull "$image"
          "${service_env[@]}" env AUTOCONTRIBUTE_RUN_DOCKER_TESTS=1 \
            "$GITHUB_WORKSPACE/.venv/bin/pytest" \
              -q -p no:cacheprovider tests/test_sandbox_live.py
