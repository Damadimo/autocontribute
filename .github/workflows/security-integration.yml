name: Security integration

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-docker-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Preload pinned sandbox image
        run: |
          image="$(uv run python -c 'from autocontribute.config import SandboxConfig; print(SandboxConfig().image)')"
          docker pull "$image"
      - name: Exercise live Docker isolation
        env:
          AUTOCONTRIBUTE_RUN_DOCKER_TESTS: "1"
        run: uv run pytest -q tests/test_sandbox_live.py
