name: NVIDIA pilot sandbox smoke

on:
  push:
    branches:
      - pilot/nvidia-cccl-e2e
    paths:
      - .github/workflows/nvidia-pilot-smoke.yml
      - autocontribute.yml

permissions:
  contents: read

concurrency:
  group: nvidia-pilot-sandbox-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check runner capacity
        run: |
          df -h /
          docker info --format '{{json .SecurityOptions}}'
      - name: Check out pinned CCCL baseline
        env:
          CCCL_SHA: 74750558d6a6f409666d0db667708f455f24714f
        run: |
          git init cccl
          git -C cccl remote add origin https://github.com/NVIDIA/cccl.git
          git -C cccl fetch --depth=1 --filter=blob:none origin "$CCCL_SHA"
          git -C cccl checkout --detach FETCH_HEAD
      - name: Preload immutable CCCL sandbox
        env:
          SANDBOX_IMAGE: >-
            rapidsai/devcontainers@sha256:b710ddb1a2013969fa972c682eafd21284d6d1891f00ce128ddca3c4634de952
        run: docker pull "$SANDBOX_IMAGE"
      - name: Run baseline debugger checks inside the production sandbox boundary
        env:
          SANDBOX_IMAGE: >-
            rapidsai/devcontainers@sha256:b710ddb1a2013969fa972c682eafd21284d6d1891f00ce128ddca3c4634de952
        run: |
          # The quoted payload is expanded by the nested /bin/sh inside the container.
          # shellcheck disable=SC2016
          timeout --signal=TERM --kill-after=5s 600s docker run --rm \
            --pull=never \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --ipc=none \
            --user="$(id -u):$(id -g)" \
            --memory=8g \
            --memory-swap=8g \
            --cpus=4 \
            --pids-limit=512 \
            --ulimit=nofile=1024:1024 \
            --ulimit=core=0:0 \
            --stop-timeout=2 \
            --init \
            --entrypoint=/usr/bin/env \
            --workdir=/workspace \
            --tmpfs=/tmp:rw,nosuid,nodev,size=512m \
            --mount="type=bind,src=$PWD/cccl,dst=/workspace" \
            --mount="type=bind,src=$PWD/cccl/.git,dst=/workspace/.git,readonly" \
            "$SANDBOX_IMAGE" \
            -i \
            HOME=/tmp \
            TMPDIR=/tmp \
            PATH=/usr/local/cuda/bin:/usr/local/python/current/bin:/usr/local/py-utils/bin:/usr/local/jupyter:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            CC=clang \
            CXX=clang++ \
            CUDAHOSTCXX=clang++ \
            CCCL_BUILD_INFIX=autocontribute \
            LD_LIBRARY_PATH=/usr/local/cuda/lib64 \
            CI=1 \
            NO_COLOR=1 \
            GIT_TERMINAL_PROMPT=0 \
            AUTOCONTRIBUTE_SANDBOX=1 \
            /bin/sh -lc \
            'set -eu;
             command -v clang-format >/dev/null;
             git diff --check &&
             python -m compileall -q libcudacxx/share/libcudacxx libcudacxx/test/debugging &&
             python -c "from enum import StrEnum" &&
             find libcudacxx/test/debugging -type f -name "*.cu" -exec clang-format --dry-run --Werror {} + &&
             /usr/local/cuda/bin/nvcc --version &&
             /usr/local/cuda/bin/cuda-gdb --version &&
             lldb --version &&
             real_lldb="$(command -v lldb)" &&
             mkdir -p build/autocontribute-tools &&
             printf "%s\n" \
               "#!/bin/sh" \
               "exec \"$real_lldb\" -o \"settings set target.disable-aslr false\" \"\$@\"" \
               >build/autocontribute-tools/lldb-no-aslr &&
             chmod 500 build/autocontribute-tools/lldb-no-aslr &&
             build/autocontribute-tools/lldb-no-aslr --version &&
             mkdir -p /tmp/autocontribute-catch2 &&
             printf "%s\n" \
               "cmake_minimum_required(VERSION 3.21)" \
               "project(AutocontributeCatch2Stub LANGUAGES NONE)" \
               "add_library(Catch2 INTERFACE)" \
               "add_library(Catch2::Catch2 ALIAS Catch2)" \
               >/tmp/autocontribute-catch2/CMakeLists.txt &&
             mkdir -p /tmp/autocontribute-dlpack/include &&
             printf "%s\n" \
               "cmake_minimum_required(VERSION 3.21)" \
               "project(AutocontributeDlpackStub LANGUAGES NONE)" \
               "add_library(dlpack INTERFACE)" \
               "add_library(dlpack::dlpack ALIAS dlpack)" \
               "target_include_directories(dlpack INTERFACE \"\${CMAKE_CURRENT_SOURCE_DIR}/include\")" \
               >/tmp/autocontribute-dlpack/CMakeLists.txt &&
             cmake --preset libcudacxx \
               -DCMAKE_CUDA_ARCHITECTURES=75-virtual \
               -DCCCL_ENABLE_CUDA_SMOKE_TESTS=OFF \
               -DFETCHCONTENT_SOURCE_DIR_CATCH2=/tmp/autocontribute-catch2 \
               -DFETCHCONTENT_SOURCE_DIR_DLPACK=/tmp/autocontribute-dlpack \
               -DLIBCUDACXX_GDB=/usr/local/cuda/bin/cuda-gdb \
               -DLIBCUDACXX_LLDB="$PWD/build/autocontribute-tools/lldb-no-aslr" \
               -DLIBCUDACXX_ENABLE_GDB_TESTING=ON \
               -DLIBCUDACXX_ENABLE_LLDB_TESTING=ON &&
             cmake --build --preset libcudacxx --target help >/tmp/autocontribute-target-help &&
             grep -oE "libcudacxx\.test\.debugging\.[[:alnum:]_-]+" \
               /tmp/autocontribute-target-help | sort -u >/tmp/autocontribute-debug-targets &&
             test -s /tmp/autocontribute-debug-targets &&
             xargs cmake --build --preset libcudacxx --parallel 2 --target \
               </tmp/autocontribute-debug-targets &&
             ctest --test-dir build/autocontribute/libcudacxx \
               --tests-regex "^libcudacxx\.test\.debugging\." \
               --exclude-regex "^libcudacxx\.test\.debugging\.buffer\." \
               --output-on-failure \
               --no-tests=error'
