name: Model canary

# Runs a short tool loop against the real model APIs, for each provider whose key is set as a
# repository secret. It costs a few cents per provider, so it runs on request: by hand, or on a
# pull request that carries the model-canary label.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  canary:
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'model-canary')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.30"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run the live tool loop
        env:
          AUTOCONTRIBUTE_RUN_MODEL_TESTS: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ] && [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Set OPENAI_API_KEY or ANTHROPIC_API_KEY as a repository secret"
            exit 1
          fi
          uv run pytest -p no:cacheprovider -rs -v tests/test_model_live.py
