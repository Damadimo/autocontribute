name: Staging shadow run

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue in the dedicated staging repository (owner/repository#number)"
        required: true
        type: string
      bootstrap_state:
        description: "Explicitly create the first staging state when no cache exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: autocontribute-staging-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  shadow-run:
    if: >-
      vars.AUTOCONTRIBUTE_STAGING_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Reserve one hour beyond the enforced 180-minute model-and-sandbox ceiling for finalization.
    timeout-minutes: 240
    steps:
      - name: Check out control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve staging state lineage
        id: state_lineage
        shell: bash
        env:
          BOOTSTRAP_STATE: ${{ inputs.bootstrap_state }}
          CONTROL_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.AUTOCONTRIBUTE_STAGING_STATE_TOKEN }}
          LINEAGE_VARIABLE: AUTOCONTRIBUTE_STAGING_STATE_LINEAGE
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "AUTOCONTRIBUTE_STAGING_STATE_TOKEN is required" >&2
            exit 1
          fi
          current="$(gh api --paginate \
            "repos/$CONTROL_REPOSITORY/actions/variables?per_page=100" \
            --jq ".variables[] | select(.name == \"$LINEAGE_VARIABLE\") | .value")"
          if [[ ! "$RUNNER_OS" =~ ^[A-Za-z][A-Za-z0-9._-]*$ ||
                ! "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ||
                ! "$RUN_ID" =~ ^[1-9][0-9]*$ ||
                ! "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "GitHub supplied an invalid staging lineage component" >&2
            exit 1
          fi
          v5_lineage_pattern="^committed:autocontribute-staging-state-v5-${RUNNER_OS}-${REPOSITORY_ID}-[1-9][0-9]*-[1-9][0-9]*$"
          v4_lineage_pattern="^committed:autocontribute-staging-state-v4-${RUNNER_OS}-${REPOSITORY_ID}-[1-9][0-9]*-[1-9][0-9]*$"
          v3_lineage_pattern="^committed:autocontribute-staging-state-v3-${RUNNER_OS}-${REPOSITORY_ID}-[1-9][0-9]*-[1-9][0-9]*$"
          bootstrap=false
          parent_schema=""
          if [[ -z "$current" ]]; then
            if [[ "$BOOTSTRAP_STATE" != "true" ]]; then
              echo "Staging lineage is missing; use one explicit bootstrap dispatch" >&2
              exit 1
            fi
            parent_key="bootstrap"
            parent_schema="bootstrap"
            bootstrap=true
          elif [[ "$current" =~ $v5_lineage_pattern ]]; then
            parent_key="${current#committed:}"
            parent_schema="v5"
          elif [[ "$current" =~ $v4_lineage_pattern ]]; then
            parent_key="${current#committed:}"
            parent_schema="v4"
          elif [[ "$current" =~ $v3_lineage_pattern ]]; then
            parent_key="${current#committed:}"
            parent_schema="v3"
          elif [[ "$current" == in-progress:* ]]; then
            echo "A prior staging generation did not commit; refusing stale rollback" >&2
            exit 1
          else
            echo "Staging lineage variable has an unsupported value" >&2
            exit 1
          fi
          new_key="autocontribute-staging-state-v5-$RUNNER_OS-$REPOSITORY_ID-$RUN_ID-$RUN_ATTEMPT"
          {
            echo "bootstrap=$bootstrap"
            echo "new_key=$new_key"
            echo "parent_key=$parent_key"
            echo "parent_schema=$parent_schema"
            echo "resolved_lineage=$current"
          } >>"$GITHUB_OUTPUT"
      - name: Restore staging state
        id: staging_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .autocontribute-staging/runs/
            .autocontribute-staging/evaluations/
            .autocontribute-staging/snapshots/state.sqlite3
          key: ${{ steps.state_lineage.outputs.parent_key }}
          fail-on-cache-miss: ${{ steps.state_lineage.outputs.bootstrap != 'true' }}
      - name: Validate staging state source
        shell: bash
        env:
          BOOTSTRAP_STATE: ${{ steps.state_lineage.outputs.bootstrap }}
          CACHE_MATCHED_KEY: ${{ steps.staging_cache.outputs.cache-matched-key }}
          EXPECTED_KEY: ${{ steps.state_lineage.outputs.parent_key }}
        run: |
          snapshot=".autocontribute-staging/snapshots/state.sqlite3"
          live_state=".autocontribute-staging/state.sqlite3"
          if [[ "$BOOTSTRAP_STATE" == "true" ]]; then
            if [[ -n "$CACHE_MATCHED_KEY" ]]; then
              echo "Bootstrap unexpectedly restored staging state" >&2
              exit 1
            fi
          elif [[ "$CACHE_MATCHED_KEY" != "$EXPECTED_KEY" ]]; then
            echo "Staging cache does not match the externally committed generation" >&2
            exit 1
          else
            if [[ -L "$snapshot" || ! -f "$snapshot" ]]; then
              echo "The matched staging cache did not contain a regular state snapshot" >&2
              exit 1
            fi
          fi
          if [[ "$BOOTSTRAP_STATE" == "true" && ( -e "$snapshot" || -L "$snapshot" || -e "$live_state" || -L "$live_state" ) ]]; then
            echo "Refusing to bootstrap over unexpected staging state" >&2
            exit 1
          fi
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Enforce staging-only configuration
        env:
          EXPECTED_REPOSITORY: ${{ vars.AUTOCONTRIBUTE_STAGING_REPOSITORY }}
          REQUESTED_ISSUE: ${{ inputs.issue }}
        run: |
          uv run python - <<'PY'
          import os
          import re
          from pathlib import Path

          from autocontribute.config import load_config

          expected = os.environ.get("EXPECTED_REPOSITORY", "")
          issue = os.environ.get("REQUESTED_ISSUE", "")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", expected):
              raise SystemExit("AUTOCONTRIBUTE_STAGING_REPOSITORY must be owner/repository")
          if not re.fullmatch(re.escape(expected) + r"#[1-9][0-9]*", issue, re.IGNORECASE):
              raise SystemExit("The requested issue must belong to the configured staging repository")

          settings = load_config(Path("autocontribute.staging.yml"))
          storage_root = Path(".autocontribute-staging")
          if storage_root.is_symlink():
              raise SystemExit("Staging storage root cannot be a symbolic link")
          expected_storage = (Path.cwd() / storage_root).resolve()
          if settings.storage.path != expected_storage:
              raise SystemExit("Staging Actions requires storage.path: .autocontribute-staging")
          configured = [name.casefold() for name in settings.github.repositories]
          if configured != [expected.casefold()] or settings.github.owners:
              raise SystemExit("Staging must use exactly one explicit repository and no owner discovery")
          if settings.publishing.mode != "review_required" or not settings.publishing.draft:
              raise SystemExit("Staging must remain review_required with draft publication enabled")
          if settings.sandbox.backend != "docker":
              raise SystemExit("Staging Actions requires sandbox.backend: docker")
          if settings.sandbox.network != "none":
              raise SystemExit("Staging Actions requires sandbox.network: none")
          if settings.sandbox.allow_unsafe_local:
              raise SystemExit("Staging Actions forbids sandbox.allow_unsafe_local")
          work_budget_seconds = (
              settings.budget.max_model_seconds_per_run
              + settings.sandbox.command_timeout_seconds * settings.sandbox.max_commands
          )
          if work_budget_seconds > 3 * 60 * 60:
              raise SystemExit(
                  "Staging Actions requires aggregate model and sandbox ceilings <= 180 minutes"
              )
          PY
      - name: Restore verified staging state
        if: ${{ steps.state_lineage.outputs.bootstrap != 'true' }}
        run: >-
          uv run autocontribute state restore
          --config autocontribute.staging.yml
          --input .autocontribute-staging/snapshots/state.sqlite3
      - name: Initialize explicitly bootstrapped staging state
        if: ${{ steps.state_lineage.outputs.bootstrap == 'true' }}
        run: uv run autocontribute safety status --config autocontribute.staging.yml
      - name: Confirm live staging state
        id: state_ready
        shell: bash
        env:
          PARENT_SCHEMA: ${{ steps.state_lineage.outputs.parent_schema }}
        run: |
          if [[ -L ".autocontribute-staging/state.sqlite3" || ! -f ".autocontribute-staging/state.sqlite3" ]]; then
            echo "Verified live staging state was not created" >&2
            exit 1
          fi
          uv run python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          from autocontribute.store import CURRENT_SCHEMA_VERSION, RunStore

          storage = Path(".autocontribute-staging")
          expected = {"bootstrap": 5, "v3": 3, "v4": 4, "v5": 5}.get(
              os.environ["PARENT_SCHEMA"]
          )
          if expected is None:
              raise SystemExit("Staging lineage did not declare a supported source schema")
          database = storage / "state.sqlite3"
          with sqlite3.connect(f"file:{database}?mode=ro", uri=True) as connection:
              row = connection.execute(
                  "SELECT schema_version FROM schema_metadata WHERE singleton = 1"
              ).fetchone()
          if row != (expected,):
              raise SystemExit("Staging cache schema does not match its committed lineage")
          store = RunStore(storage)
          if store.schema_version != CURRENT_SCHEMA_VERSION:
              raise SystemExit("Staging state did not migrate to the current schema")
          PY
      - name: Preload configured sandbox image
        run: |
          image="$(uv run python -c 'from pathlib import Path; from autocontribute.config import load_config; print(load_config(Path("autocontribute.staging.yml")).sandbox.image)')"
          docker pull "$image"
      - name: Claim staging state lineage
        id: state_claim
        shell: bash
        env:
          CONTROL_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.AUTOCONTRIBUTE_STAGING_STATE_TOKEN }}
          LINEAGE_VARIABLE: AUTOCONTRIBUTE_STAGING_STATE_LINEAGE
          PARENT_KEY: ${{ steps.state_lineage.outputs.parent_key }}
          RESOLVED_LINEAGE: ${{ steps.state_lineage.outputs.resolved_lineage }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          endpoint="repos/$CONTROL_REPOSITORY/actions/variables/$LINEAGE_VARIABLE"
          current="$(gh api --paginate \
            "repos/$CONTROL_REPOSITORY/actions/variables?per_page=100" \
            --jq ".variables[] | select(.name == \"$LINEAGE_VARIABLE\") | .value")"
          if [[ "$current" != "$RESOLVED_LINEAGE" ]]; then
            echo "Staging lineage changed during preflight" >&2
            exit 1
          fi
          claim="in-progress:$RUN_ID:$RUN_ATTEMPT:$PARENT_KEY"
          if [[ -z "$RESOLVED_LINEAGE" ]]; then
            gh api --method POST "repos/$CONTROL_REPOSITORY/actions/variables" \
              -f name="$LINEAGE_VARIABLE" -f value="$claim" >/dev/null
          else
            gh api --method PATCH "$endpoint" -f name="$LINEAGE_VARIABLE" \
              -f value="$claim" >/dev/null
          fi
          echo "claim=$claim" >>"$GITHUB_OUTPUT"
      - name: Sync staging pull-request lifecycle
        env:
          AUTOCONTRIBUTE_STAGING_GITHUB_TOKEN: ${{ secrets.AUTOCONTRIBUTE_STAGING_GITHUB_TOKEN }}
        run: uv run autocontribute lifecycle sync --config autocontribute.staging.yml
      - name: Validate live staging dependencies
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTOCONTRIBUTE_STAGING_GITHUB_TOKEN: ${{ secrets.AUTOCONTRIBUTE_STAGING_GITHUB_TOKEN }}
        run: uv run autocontribute doctor --config autocontribute.staging.yml --non-interactive
      - name: Prepare shadow contribution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTOCONTRIBUTE_STAGING_GITHUB_TOKEN: ${{ secrets.AUTOCONTRIBUTE_STAGING_GITHUB_TOKEN }}
          REQUESTED_ISSUE: ${{ inputs.issue }}
        run: uv run autocontribute run --config autocontribute.staging.yml --issue "$REQUESTED_ISSUE"
      - name: Create verified staging-state snapshot
        id: state_snapshot
        if: >-
          ${{ always() && steps.state_ready.outcome == 'success' &&
          steps.state_claim.outcome == 'success' }}
        run: uv run autocontribute state backup --config autocontribute.staging.yml --overwrite
      - name: Save staging state snapshot
        id: state_cache_save
        if: ${{ always() && steps.state_snapshot.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .autocontribute-staging/runs/
            .autocontribute-staging/evaluations/
            .autocontribute-staging/snapshots/state.sqlite3
          key: ${{ steps.state_lineage.outputs.new_key }}
      - name: Verify staging state snapshot persistence
        id: state_cache_verify
        if: ${{ always() && steps.state_snapshot.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .autocontribute-staging/runs/
            .autocontribute-staging/evaluations/
            .autocontribute-staging/snapshots/state.sqlite3
          key: ${{ steps.state_lineage.outputs.new_key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Upload staging evidence
        id: evidence_upload
        if: >-
          ${{ always() && steps.state_cache_verify.outcome == 'success' &&
          steps.state_cache_verify.outputs.cache-hit == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autocontribute-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .autocontribute-staging/runs/
            .autocontribute-staging/evaluations/
            .autocontribute-staging/snapshots/state.sqlite3
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Commit staging state lineage
        if: >-
          ${{ always() && steps.state_cache_verify.outcome == 'success' &&
          steps.state_cache_verify.outputs.cache-hit == 'true' &&
          steps.evidence_upload.outcome == 'success' }}
        shell: bash
        env:
          CLAIMED_LINEAGE: ${{ steps.state_claim.outputs.claim }}
          CONTROL_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.AUTOCONTRIBUTE_STAGING_STATE_TOKEN }}
          LINEAGE_VARIABLE: AUTOCONTRIBUTE_STAGING_STATE_LINEAGE
          NEW_KEY: ${{ steps.state_lineage.outputs.new_key }}
        run: |
          set -euo pipefail
          endpoint="repos/$CONTROL_REPOSITORY/actions/variables/$LINEAGE_VARIABLE"
          current="$(gh api "$endpoint" --jq .value)"
          if [[ "$current" != "$CLAIMED_LINEAGE" ]]; then
            echo "Staging lineage changed after it was claimed" >&2
            exit 1
          fi
          gh api --method PATCH "$endpoint" -f name="$LINEAGE_VARIABLE" \
            -f value="committed:$NEW_KEY" >/dev/null
