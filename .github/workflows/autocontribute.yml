name: Prepare contribution

on:
  schedule:
    # Twice daily at deliberately non-round minutes. This job is inert until the repository variable
    # AUTOCONTRIBUTE_ENABLED is set to true.
    - cron: "17 9,21 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Optional owner/repository#number override"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: autocontribute-${{ github.repository_owner }}
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.AUTOCONTRIBUTE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore scheduler state
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .autocontribute/runs/
            .autocontribute/state.sqlite3
          key: autocontribute-state-v1-${{ runner.os }}-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            autocontribute-state-v1-${{ runner.os }}-${{ github.repository_id }}-
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Autocontribute
        run: uv sync --locked
      - name: Preload the configured sandbox image
        run: |
          image="$(uv run python -c 'from pathlib import Path; from autocontribute.config import load_config; print(load_config(Path("autocontribute.yml")).sandbox.image)')"
          docker pull "$image"
      - name: Validate configuration and isolation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTOCONTRIBUTE_GITHUB_TOKEN: ${{ secrets.AUTOCONTRIBUTE_GITHUB_TOKEN }}
        run: uv run autocontribute doctor --non-interactive
      - name: Prepare one contribution attempt
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTOCONTRIBUTE_GITHUB_TOKEN: ${{ secrets.AUTOCONTRIBUTE_GITHUB_TOKEN }}
          AUTOCONTRIBUTE_ALLOW_AUTO_PUBLISH: ${{ vars.AUTOCONTRIBUTE_ALLOW_AUTO_PUBLISH }}
          REQUESTED_ISSUE: ${{ inputs.issue }}
        run: |
          args=(--scheduled)
          if [ -n "$REQUESTED_ISSUE" ]; then
            args+=(--issue "$REQUESTED_ISSUE")
          fi
          uv run autocontribute run "${args[@]}"
      - name: Save scheduler state
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .autocontribute/runs/
            .autocontribute/state.sqlite3
          key: autocontribute-state-v1-${{ runner.os }}-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autocontribute-${{ github.run_id }}
          path: |
            .autocontribute/runs/
            .autocontribute/state.sqlite3
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
