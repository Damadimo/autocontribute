name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Re-evaluate the locked dependency snapshot even without a source push.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.8"
          cache: false
      - name: Install pinned repository scanners
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - name: Check workflows and embedded shell
        run: |
          shellcheck --version
          "$(go env GOPATH)/bin/actionlint" -shellcheck "$(command -v shellcheck)"
          # The runner template's workflows run in the repositories made from it. actionlint
          # does not know the concurrency queue key yet, which GitHub added in May 2026.
          "$(go env GOPATH)/bin/actionlint" -shellcheck "$(command -v shellcheck)" \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            template/.github/workflows/*.yml
      - name: Scan complete history for secrets
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --verbose .'

  dependency-and-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: "3.12"
          enable-cache: true
      - name: Audit the locked runtime dependency graph
        shell: bash
        run: |
          set -euo pipefail
          uv export \
            --locked \
            --no-dev \
            --no-emit-project \
            --format requirements-txt \
            | uvx --from pip-audit==2.9.0 pip-audit \
              --requirement /dev/stdin \
              --disable-pip \
              --progress-spinner off
      - name: Scan Python sources for medium and high confidence security findings
        run: >-
          uvx --from bandit==1.8.6 bandit
          --quiet --recursive src
          --severity-level medium --confidence-level medium

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Verify portable lock sources
        run: uv run --no-project python tests/test_packaging.py
      - name: Verify lockfile
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy src
      - name: Test
        run: uv run pytest --cov=autocontribute --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: "3.12"
          enable-cache: true
      - name: Build source distribution and wheel
        run: uv build --clear
      - name: Install the wheel in a clean environment
        run: |
          uv venv --python 3.12 "${RUNNER_TEMP}/autocontribute-package"
          uv pip install \
            --python "${RUNNER_TEMP}/autocontribute-package/bin/python" \
            dist/autocontribute-*.whl
      - name: Run the installed command
        run: |
          cd "${RUNNER_TEMP}"
          autocontribute-package/bin/autocontribute --help
      - name: Load the system prompts from the installed wheel
        run: |
          cd "${RUNNER_TEMP}"
          autocontribute-package/bin/python -I -c '
          from typing import get_args
          from autocontribute.instructions import load_instructions
          from autocontribute.transcript import TranscriptKind
          for kind in get_args(TranscriptKind):
              assert load_instructions(kind), kind
          '
