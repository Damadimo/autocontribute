name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Re-evaluate the locked dependency snapshot and hosted baselines even without a source push.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.23.8"
          cache: false
      - name: Install pinned repository scanners
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - name: Check workflows and embedded shell
        run: |
          shellcheck --version
          "$(go env GOPATH)/bin/actionlint" -shellcheck "$(command -v shellcheck)"
      - name: Scan complete history for secrets
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --verbose .'

  dependency-and-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: "3.12"
          enable-cache: true
      - name: Audit the locked runtime dependency graph
        shell: bash
        run: |
          set -euo pipefail
          uv export \
            --locked \
            --no-dev \
            --no-emit-project \
            --format requirements-txt \
            | uvx --from pip-audit==2.9.0 pip-audit \
              --requirement /dev/stdin \
              --disable-pip \
              --progress-spinner off
      - name: Scan Python sources for medium and high confidence security findings
        run: >-
          uvx --from bandit==1.8.6 bandit
          --quiet --recursive src
          --severity-level medium --confidence-level medium

  systemd-deployment:
    # Require the reviewed systemd major and let parser or scoring changes fail the checked-in
    # exposure ceilings visibly. Ubuntu 24.04 currently ships systemd 255.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the controlled systemd baseline
        shell: bash
        run: |
          set -euo pipefail
          systemd-analyze --version
          systemd_major="$(systemd-analyze --version | awk 'NR == 1 { print $2 }')"
          if [[ "$systemd_major" != "255" ]]; then
            echo "Expected systemd 255 on the pinned Ubuntu 24.04 runner, got $systemd_major" >&2
            exit 1
          fi
      - name: Make packaged helpers available to executable validation
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o root -g root -m 0755 /usr/local/libexec
          sudo install -o root -g root -m 0755 \
            deploy/systemd/libexec/* \
            /usr/local/libexec/
          sudo install -d -o root -g root -m 0755 \
            /opt/autocontribute/current/.venv/bin
          sudo install -o root -g root -m 0755 \
            /usr/bin/true \
            /opt/autocontribute/current/.venv/bin/autocontribute
          if [[ ! -x /usr/bin/dockerd-rootless.sh ]]; then
            sudo install -o root -g root -m 0755 \
              /usr/bin/true /usr/bin/dockerd-rootless.sh
          fi
          manager_uid="$(id --user)"
          manager_drop_in_directory="/etc/systemd/system/user@${manager_uid}.service.d"
          sudo install -d -o root -g root -m 0755 \
            /etc/systemd/user "$manager_drop_in_directory"
          sudo install -o root -g root -m 0644 \
            deploy/systemd/user/autocontribute-rootless-docker-daemon.service \
            /etc/systemd/user/autocontribute-rootless-docker-daemon.service
          sudo install -o root -g root -m 0644 \
            deploy/systemd/autocontribute-user-manager.conf \
            "$manager_drop_in_directory/50-autocontribute.conf"
      - name: Exercise bounded workspace preflight in a hardened service
        shell: bash
        run: |
          set -Eeuo pipefail

          loop_device=""
          smoke_root=""
          workspace_image=""
          workspace_mount=""

          cleanup_workspace_quota_smoke() {
            local exit_status=$?
            local cleanup_failed=0
            local still_mounted=0
            trap - EXIT
            set +e

            if [[ -n "$workspace_mount" ]] && mountpoint --quiet -- "$workspace_mount"; then
              if ! sudo umount -- "$workspace_mount"; then
                echo "Failed to unmount the workspace quota smoke-test filesystem" >&2
                cleanup_failed=1
                still_mounted=1
              fi
            fi
            if [[ "$still_mounted" -eq 0 && -n "$loop_device" ]]; then
              if sudo losetup --detach "$loop_device"; then
                loop_device=""
              else
                echo "Failed to detach the workspace quota smoke-test loop device" >&2
                cleanup_failed=1
              fi
            fi
            if [[ "$still_mounted" -eq 0 && -z "$loop_device" && -n "$smoke_root" ]]; then
              if [[ -n "$workspace_image" ]]; then
                rm -f -- "$workspace_image" || cleanup_failed=1
              fi
              for cleanup_directory in \
                "$workspace_mount" "${workspace_mount%/*}" "$smoke_root"; do
                if [[ -d "$cleanup_directory" ]] && ! rmdir -- "$cleanup_directory"; then
                  echo "Failed to remove smoke-test directory: $cleanup_directory" >&2
                  cleanup_failed=1
                fi
              done
            fi
            if [[ "$exit_status" -eq 0 && "$cleanup_failed" -ne 0 ]]; then
              exit_status=1
            fi
            exit "$exit_status"
          }
          trap cleanup_workspace_quota_smoke EXIT

          for required_command in \
            findmnt losetup mkfs.ext4 mount mountpoint realpath systemd-run truncate umount; do
            command -v "$required_command" >/dev/null
          done
          unset required_command
          test "$(cat /proc/1/comm)" = systemd

          smoke_root="$(mktemp --directory \
            "${RUNNER_TEMP}/autocontribute-workspace-quota.XXXXXX")"
          smoke_root="$(realpath "$smoke_root")"
          workspace_image="${smoke_root}/workspace.ext4"
          workspace_mount="${smoke_root}/state/workspaces"
          install -d -m 0700 "$workspace_mount"
          # A sparse loop image is acceptable only for this disposable integration fixture. Its
          # logical capacity exercises the production free-space and fixed-inode floors.
          truncate --size 5G "$workspace_image"
          loop_device="$(sudo losetup --find --show "$workspace_image")"
          if [[ ! "$loop_device" =~ ^/dev/loop[0-9]+$ ]]; then
            echo "losetup returned an unexpected loop-device path" >&2
            exit 1
          fi
          sudo mkfs.ext4 -q -N 131072 "$loop_device"
          sudo mount -t ext4 -o nodev,nosuid -- "$loop_device" "$workspace_mount"

          service_uid="$(id --user)"
          service_gid="$(id --group)"
          test "$service_uid" -ne 0
          sudo chown "${service_uid}:${service_gid}" "$workspace_mount"
          chmod 0700 "$workspace_mount"
          test "$(stat --format=%u "$workspace_mount")" = "$service_uid"
          test "$(stat --format=%g "$workspace_mount")" = "$service_gid"
          test "$(stat --format=%a "$workspace_mount")" = 700

          quota_unit="autocontribute-workspace-quota-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          sudo systemd-run \
            --unit="$quota_unit" \
            --wait \
            --collect \
            --pipe \
            --property=Type=exec \
            --property="User=$service_uid" \
            --property="Group=$service_gid" \
            --property=NoNewPrivileges=yes \
            --property=PrivateDevices=yes \
            --property=PrivateTmp=yes \
            --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes \
            --property="ReadWritePaths=$smoke_root" \
            /usr/local/libexec/autocontribute-workspace-quota-check --headroom "$workspace_mount"
      - name: Exercise durable storage preflight in a hardened service
        shell: bash
        run: |
          set -Eeuo pipefail

          backup_image=""
          backup_loop=""
          backup_mount=""
          backup_parent=""
          smoke_root=""
          state_image=""
          state_loop=""
          state_mount=""
          state_parent=""

          cleanup_storage_smoke() {
            local exit_status=$?
            local cleanup_failed=0
            local mounts_detached=1
            trap - EXIT
            set +e

            for cleanup_mount in "$backup_mount" "$state_mount"; do
              if [[ -n "$cleanup_mount" ]] && mountpoint --quiet -- "$cleanup_mount"; then
                if ! sudo umount -- "$cleanup_mount"; then
                  echo "Failed to unmount storage smoke-test filesystem: $cleanup_mount" >&2
                  cleanup_failed=1
                  mounts_detached=0
                fi
              fi
            done
            if [[ "$mounts_detached" -eq 1 ]]; then
              for cleanup_loop in "$backup_loop" "$state_loop"; do
                if [[ -n "$cleanup_loop" ]] && ! sudo losetup --detach "$cleanup_loop"; then
                  echo "Failed to detach storage smoke-test loop device: $cleanup_loop" >&2
                  cleanup_failed=1
                  mounts_detached=0
                fi
              done
            fi
            if [[ "$mounts_detached" -eq 1 && -n "$smoke_root" ]]; then
              for cleanup_image in "$backup_image" "$state_image"; do
                if [[ -n "$cleanup_image" ]]; then
                  rm -f -- "$cleanup_image" || cleanup_failed=1
                fi
              done
              for cleanup_directory in \
                "$backup_mount" "$state_mount" "$backup_parent" "$state_parent" "$smoke_root"; do
                if [[ -d "$cleanup_directory" ]] && ! rmdir -- "$cleanup_directory"; then
                  echo "Failed to remove storage smoke-test directory: $cleanup_directory" >&2
                  cleanup_failed=1
                fi
              done
            fi
            if [[ "$exit_status" -eq 0 && "$cleanup_failed" -ne 0 ]]; then
              exit_status=1
            fi
            exit "$exit_status"
          }
          trap cleanup_storage_smoke EXIT

          for required_command in \
            findmnt losetup mkfs.ext4 mount mountpoint realpath systemd-run truncate umount; do
            command -v "$required_command" >/dev/null
          done
          unset required_command
          test "$(cat /proc/1/comm)" = systemd

          smoke_root="$(mktemp --directory \
            "${RUNNER_TEMP}/autocontribute-storage-capacity.XXXXXX")"
          smoke_root="$(realpath "$smoke_root")"
          state_image="${smoke_root}/state.ext4"
          backup_image="${smoke_root}/backup.ext4"
          state_parent="${smoke_root}/state-parent"
          backup_parent="${smoke_root}/backup-parent"
          state_mount="${state_parent}/state"
          backup_mount="${backup_parent}/backups"
          install -d -m 0700 \
            "$state_parent" "$backup_parent" "$state_mount" "$backup_mount"

          # Sparse files are acceptable only for this disposable boundary test. Production storage
          # must be fully allocated as documented in docs/systemd-deployment.md.
          truncate --size 2G "$state_image"
          truncate --size 24G "$backup_image"
          state_loop="$(sudo losetup --find --show "$state_image")"
          backup_loop="$(sudo losetup --find --show "$backup_image")"
          if [[ ! "$state_loop" =~ ^/dev/loop[0-9]+$ || ! "$backup_loop" =~ ^/dev/loop[0-9]+$ ]]; then
            echo "losetup returned an unexpected storage smoke-test device path" >&2
            exit 1
          fi
          sudo mkfs.ext4 -q -m 1 -N 65536 "$state_loop"
          sudo mkfs.ext4 -q -m 0 -N 393216 "$backup_loop"
          sudo mount -t ext4 -o nodev,nosuid,noexec -- "$state_loop" "$state_mount"
          sudo mount -t ext4 -o nodev,nosuid,noexec -- "$backup_loop" "$backup_mount"

          service_uid="$(id --user)"
          service_gid="$(id --group)"
          test "$service_uid" -ne 0
          sudo chown "${service_uid}:${service_gid}" "$state_mount" "$backup_mount"
          chmod 0700 "$state_mount" "$backup_mount"

          storage_unit="autocontribute-storage-capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo systemd-run \
            --unit="${storage_unit}-backup.service" \
            --wait \
            --collect \
            --pipe \
            --property=Type=exec \
            --property="User=$service_uid" \
            --property="Group=$service_gid" \
            --property=NoNewPrivileges=yes \
            --property=PrivateDevices=yes \
            --property=PrivateTmp=yes \
            --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes \
            --property="ReadWritePaths=$state_parent $backup_mount" \
            /usr/local/libexec/autocontribute-storage-capacity-check \
              "$state_mount" "$backup_mount" --writable

          sudo systemd-run \
            --unit="${storage_unit}-worker.service" \
            --wait \
            --collect \
            --pipe \
            --property=Type=exec \
            --property="User=$service_uid" \
            --property="Group=$service_gid" \
            --property=NoNewPrivileges=yes \
            --property=PrivateDevices=yes \
            --property=PrivateTmp=yes \
            --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes \
            --property="ReadWritePaths=$state_parent" \
            --property="ReadOnlyPaths=$backup_mount" \
            /usr/local/libexec/autocontribute-storage-capacity-check \
              "$state_mount" "$backup_mount" --state-writable

          sudo systemd-run \
            --unit="${storage_unit}-health.service" \
            --wait \
            --collect \
            --pipe \
            --property=Type=exec \
            --property="User=$service_uid" \
            --property="Group=$service_gid" \
            --property=NoNewPrivileges=yes \
            --property=PrivateDevices=yes \
            --property=PrivateTmp=yes \
            --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes \
            --property="ReadOnlyPaths=$state_mount $backup_mount" \
            /usr/local/libexec/autocontribute-storage-capacity-check \
              "$state_mount" "$backup_mount" --read-only
      - name: Exercise bounded Docker data-root preflight in a hardened service
        shell: bash
        run: |
          set -Eeuo pipefail

          docker_data_image=""
          docker_data_mount=""
          loop_device=""
          smoke_root=""

          cleanup_docker_data_smoke() {
            local exit_status=$?
            local cleanup_failed=0
            local still_mounted=0
            trap - EXIT
            set +e

            if [[ -n "$docker_data_mount" ]] && mountpoint --quiet -- "$docker_data_mount"; then
              if ! sudo umount -- "$docker_data_mount"; then
                echo "Failed to unmount the Docker data-root smoke-test filesystem" >&2
                cleanup_failed=1
                still_mounted=1
              fi
            fi
            if [[ "$still_mounted" -eq 0 && -n "$loop_device" ]]; then
              if sudo losetup --detach "$loop_device"; then
                loop_device=""
              else
                echo "Failed to detach the Docker data-root smoke-test loop device" >&2
                cleanup_failed=1
              fi
            fi
            if [[ "$still_mounted" -eq 0 && -z "$loop_device" && -n "$smoke_root" ]]; then
              if [[ -n "$docker_data_image" ]]; then
                rm -f -- "$docker_data_image" || cleanup_failed=1
              fi
              for cleanup_directory in "$docker_data_mount" "$smoke_root"; do
                if [[ -d "$cleanup_directory" ]] && ! rmdir -- "$cleanup_directory"; then
                  echo "Failed to remove smoke-test directory: $cleanup_directory" >&2
                  cleanup_failed=1
                fi
              done
            fi
            if [[ "$exit_status" -eq 0 && "$cleanup_failed" -ne 0 ]]; then
              exit_status=1
            fi
            exit "$exit_status"
          }
          trap cleanup_docker_data_smoke EXIT

          for required_command in \
            fallocate findmnt losetup mkfs.ext4 mount mountpoint realpath systemd-run umount; do
            command -v "$required_command" >/dev/null
          done
          unset required_command
          test "$(cat /proc/1/comm)" = systemd

          smoke_root="$(mktemp --directory \
            "${RUNNER_TEMP}/autocontribute-docker-data.XXXXXX")"
          smoke_root="$(realpath "$smoke_root")"
          docker_data_image="${smoke_root}/docker.ext4"
          docker_data_mount="${smoke_root}/docker"
          install -d -m 0710 "$docker_data_mount"
          fallocate --length 2G "$docker_data_image"
          loop_device="$(sudo losetup --find --show "$docker_data_image")"
          if [[ ! "$loop_device" =~ ^/dev/loop[0-9]+$ ]]; then
            echo "losetup returned an unexpected loop-device path" >&2
            exit 1
          fi
          sudo mkfs.ext4 -q -m 0 -N 32768 "$loop_device"
          sudo mount -t ext4 -o nodev,nosuid -- "$loop_device" "$docker_data_mount"

          service_uid="$(id --user)"
          service_gid="$(id --group)"
          test "$service_uid" -ne 0
          sudo chown "${service_uid}:${service_gid}" "$docker_data_mount"
          chmod 0710 "$docker_data_mount"
          test "$(stat --format=%u "$docker_data_mount")" = "$service_uid"
          test "$(stat --format=%g "$docker_data_mount")" = "$service_gid"
          test "$(stat --format=%a "$docker_data_mount")" = 710

          data_unit="autocontribute-docker-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          sudo systemd-run \
            --unit="$data_unit" \
            --wait \
            --collect \
            --pipe \
            --property=Type=exec \
            --property="User=$service_uid" \
            --property="Group=$service_gid" \
            --property=NoNewPrivileges=yes \
            --property=PrivateDevices=yes \
            --property=PrivateTmp=yes \
            --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes \
            --property="ReadWritePaths=$smoke_root" \
            /usr/local/libexec/autocontribute-docker-data-check \
            --mount-only "$docker_data_mount"

          health_unit="autocontribute-docker-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          sudo systemd-run \
            --unit="$health_unit" \
            --wait \
            --collect \
            --pipe \
            --property=Type=exec \
            --property="User=$service_uid" \
            --property="Group=$service_gid" \
            --property=NoNewPrivileges=yes \
            --property=PrivateDevices=yes \
            --property=PrivateTmp=yes \
            --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes \
            --property="ReadWritePaths=$smoke_root" \
            --property="ReadOnlyPaths=$docker_data_mount" \
            /usr/local/libexec/autocontribute-docker-data-check \
            --read-only-health "$docker_data_mount"
      - name: Verify system, timer, and protected user units
        shell: bash
        env:
          SYSTEMD_LOG_COLOR: "0"
          SYSTEMD_PAGER: cat
        run: |
          set -euo pipefail
          mapfile -t units < <(
            find deploy/systemd -maxdepth 1 -type f \
              \( -name '*.service' -o -name '*.timer' \) \
              -print | sort
          )
          if [[ "${#units[@]}" -ne 12 ]]; then
            echo "Expected exactly twelve packaged systemd system units" >&2
            exit 1
          fi
          systemd-analyze verify \
            --man=no \
            --recursive-errors=no \
            "${units[@]}"

          mapfile -t user_units < <(
            find deploy/systemd/user -maxdepth 1 -type f \
              \( -name '*.service' -o -name '*.timer' \) \
              -print | sort
          )
          if [[ "${#user_units[@]}" -ne 1 ]]; then
            echo "Expected exactly one protected rootless Docker user unit" >&2
            exit 1
          fi
          test "${user_units[0]}" = \
            deploy/systemd/user/autocontribute-rootless-docker-daemon.service
          test "$(stat --format=%U:%G:%a \
            /etc/systemd/user/autocontribute-rootless-docker-daemon.service)" = root:root:644
          manager_uid="$(id --user)"
          manager_drop_in="/etc/systemd/system/user@${manager_uid}.service.d/50-autocontribute.conf"
          test "$(stat --format=%U:%G:%a \
            "$manager_drop_in")" = root:root:644
          test ! -e /etc/systemd/system/user@.service.d/50-autocontribute.conf
          cmp --silent \
            deploy/systemd/user/autocontribute-rootless-docker-daemon.service \
            /etc/systemd/user/autocontribute-rootless-docker-daemon.service
          cmp --silent \
            deploy/systemd/autocontribute-user-manager.conf \
            "$manager_drop_in"
          for vendor_drop_in in \
            /usr/lib/systemd/system/user@.service.d/10-login-barrier.conf \
            /usr/lib/systemd/system/user@.service.d/timeout.conf; do
            test "$(stat --format=%U:%G:%a "$vendor_drop_in")" = root:root:644
          done
          unset vendor_drop_in
          SYSTEMD_UNIT_PATH=/etc/systemd/user:/run/systemd/user:/usr/local/lib/systemd/user:/usr/lib/systemd/user \
            systemd-analyze --user verify \
              --man=no \
              --recursive-errors=no \
              "${user_units[@]}"
          systemd-analyze verify \
            --man=no \
            --recursive-errors=no \
            "user@${manager_uid}.service"
      - name: Enforce service hardening exposure ceilings
        shell: bash
        env:
          SYSTEMD_LOG_COLOR: "0"
          SYSTEMD_PAGER: cat
        run: |
          set -euo pipefail
          # systemd expresses its 0.0-10.0 score as tenths in --threshold (0-100).
          # The nested rootless daemon intentionally needs namespaces and networking; its safety
          # is exercised by the live cgroup/isolation job. This table covers system services only.
          declare -Ar exposure_ceiling=(
            [autocontribute-worker.service]=40
            [autocontribute-doctor.service]=40
            [autocontribute-rootless-docker.service]=30
            [autocontribute-backup.service]=30
            [autocontribute-replication.service]=30
            [autocontribute-health.service]=30
            [autocontribute-failure@.service]=30
            [autocontribute-alert@.service]=30
          )
          mapfile -t services < <(
            find deploy/systemd -maxdepth 1 -type f -name '*.service' -print | sort
          )
          if [[ "${#services[@]}" -ne "${#exposure_ceiling[@]}" ]]; then
            echo "Every packaged service must have an explicit exposure ceiling" >&2
            exit 1
          fi
          for service_path in "${services[@]}"; do
            service="${service_path##*/}"
            ceiling="${exposure_ceiling[$service]:-}"
            if [[ -z "$ceiling" ]]; then
              echo "Missing security exposure ceiling for $service" >&2
              exit 1
            fi
            systemd-analyze security \
              --offline=yes \
              --threshold="$ceiling" \
              --no-pager \
              "$service_path"
          done

  ubuntu-deployment-recovery:
    name: Ubuntu 24.04 deployment/recovery acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: "3.12"
          enable-cache: true
      - name: Exercise installed backup and recovery
        shell: bash
        run: tests/acceptance/ubuntu_24_04_deployment_recovery.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Verify portable lock sources
        run: uv run --no-project python tests/test_packaging.py
      - name: Verify lockfile
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy src
      - name: Test
        run: uv run pytest --cov=autocontribute --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked build backend
        run: uv sync --locked --extra dev --no-install-project
      - name: Build source distribution
        run: >-
          uv build --sdist --no-sources --no-build-isolation --offline
          --python .venv/bin/python --clear
      - name: Verify source distribution systemd assets
        run: |
          .venv/bin/python - <<'PY'
          import json
          import tarfile
          from pathlib import Path, PurePosixPath

          archives = sorted(Path("dist").glob("autocontribute-*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"expected one source distribution, found {len(archives)}")

          manifest_path = Path("src/autocontribute/_systemd_assets.json")
          manifest_bytes = manifest_path.read_bytes()
          manifest = json.loads(manifest_bytes)
          assets = manifest.get("assets")
          if not isinstance(assets, list) or len(assets) != 28:
              raise SystemExit("source systemd asset manifest must contain exactly 28 assets")
          expected = {
              asset["source_path"]: int(asset["mode"], 8)
              for asset in assets
          }
          if len(expected) != len(assets):
              raise SystemExit("source systemd asset manifest contains duplicate paths")

          with tarfile.open(archives[0], mode="r:gz") as archive:
              members = archive.getmembers()
              roots = {
                  PurePosixPath(member.name).parts[0]
                  for member in members
                  if PurePosixPath(member.name).parts
              }
              if len(roots) != 1:
                  raise SystemExit("source distribution must contain one top-level directory")
              root = roots.pop()
              member_by_name = {member.name: member for member in members}
              if len(member_by_name) != len(members):
                  raise SystemExit("source distribution contains duplicate archive members")

              archive_manifest_name = f"{root}/{manifest_path.as_posix()}"
              archive_manifest = member_by_name.get(archive_manifest_name)
              if archive_manifest is None or not archive_manifest.isfile():
                  raise SystemExit("source distribution omits the systemd asset manifest")
              extracted_manifest = archive.extractfile(archive_manifest)
              if extracted_manifest is None or extracted_manifest.read() != manifest_bytes:
                  raise SystemExit("source distribution systemd manifest differs from source")

              prefix = f"{root}/deploy/systemd/"
              unsafe_assets = sorted(
                  member.name.removeprefix(f"{root}/")
                  for member in members
                  if member.name.startswith(prefix)
                  and not member.isdir()
                  and not member.isfile()
              )
              if unsafe_assets:
                  raise SystemExit(
                      f"source distribution contains non-regular systemd assets: "
                      f"{unsafe_assets}"
                  )
              archived_assets = {
                  member.name.removeprefix(f"{root}/")
                  for member in members
                  if member.isfile() and member.name.startswith(prefix)
              }
              if archived_assets != set(expected):
                  missing = sorted(set(expected) - archived_assets)
                  extra = sorted(archived_assets - set(expected))
                  raise SystemExit(
                      f"source distribution systemd inventory differs: "
                      f"missing={missing}, extra={extra}"
                  )
              for source_path, expected_mode in expected.items():
                  member = member_by_name[f"{root}/{source_path}"]
                  extracted = archive.extractfile(member)
                  if extracted is None or extracted.read() != Path(source_path).read_bytes():
                      raise SystemExit(
                          f"source distribution asset differs from source: {source_path}"
                      )
                  if member.mode != expected_mode:
                      raise SystemExit(
                          f"source distribution asset mode differs: {source_path}"
                      )
          PY
      - name: Build wheel from source distribution
        run: >-
          uv build dist/autocontribute-*.tar.gz --wheel --out-dir dist/wheel
          --no-build-isolation --offline --python .venv/bin/python
      - name: Verify installed package
        run: |
          uv venv --python 3.12 "${RUNNER_TEMP}/autocontribute-package"
          uv pip install \
            --python "${RUNNER_TEMP}/autocontribute-package/bin/python" \
            dist/wheel/autocontribute-*.whl
          cd "${RUNNER_TEMP}"
          autocontribute_version="$(autocontribute-package/bin/autocontribute version)"
          test "$autocontribute_version" = "0.1.0"
          autocontribute-package/bin/autocontribute --help
          autocontribute-package/bin/python - <<'PY'
          import os
          from pathlib import Path

          import autocontribute.deployment as deployment

          installed_manifest = Path(deployment.__file__).with_name("_build_identity.json")
          installed_systemd_manifest = Path(deployment.__file__).with_name(
              "_systemd_assets.json"
          )
          source_manifest = (
              Path(os.environ["GITHUB_WORKSPACE"])
              / "src"
              / "autocontribute"
              / "_build_identity.json"
          )
          source_systemd_manifest = (
              Path(os.environ["GITHUB_WORKSPACE"])
              / "src"
              / "autocontribute"
              / "_systemd_assets.json"
          )
          if installed_manifest.read_bytes() != source_manifest.read_bytes():
              raise SystemExit("wheel build identity differs from source")
          if installed_systemd_manifest.read_bytes() != source_systemd_manifest.read_bytes():
              raise SystemExit("wheel systemd asset manifest differs from source")
          if len(deployment.packaged_build_identity_digest()) != 64:
              raise SystemExit("wheel build identity digest is invalid")
          if len(deployment.packaged_systemd_asset_manifest_digest()) != 64:
              raise SystemExit("wheel systemd asset manifest digest is invalid")
          if len(deployment.runtime_environment_digest()) != 64:
              raise SystemExit("wheel runtime identity digest is invalid")
          PY
