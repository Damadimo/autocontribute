name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Verify portable lock sources
        run: uv run --no-project python tests/test_packaging.py
      - name: Verify lockfile
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy src
      - name: Test
        run: uv run pytest --cov=autocontribute --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: "3.12"
          enable-cache: true
      - name: Build source distribution
        run: uv build --sdist --no-sources --clear
      - name: Build wheel from source distribution
        run: uv build dist/autocontribute-*.tar.gz --wheel --out-dir dist/wheel
      - name: Verify installed package
        run: |
          uv venv --python 3.12 "${RUNNER_TEMP}/autocontribute-package"
          uv pip install \
            --python "${RUNNER_TEMP}/autocontribute-package/bin/python" \
            dist/wheel/autocontribute-*.whl
          cd "${RUNNER_TEMP}"
          autocontribute_version="$(autocontribute-package/bin/autocontribute version)"
          test "$autocontribute_version" = "0.1.0"
          autocontribute-package/bin/autocontribute --help
