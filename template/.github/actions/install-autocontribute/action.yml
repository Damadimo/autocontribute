name: Install autocontribute
description: Install the pinned autocontribute release. This is the only place its version is set.
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.9.30"
        enable-cache: false
    - name: Install autocontribute
      shell: bash
      run: |
        uv tool install --python 3.12 "git+https://github.com/Damadimo/autocontribute@v0.1.0"
        uv tool dir --bin >>"$GITHUB_PATH"
