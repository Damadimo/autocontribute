name: prepare

on:
  schedule:
    # Off the hour, when GitHub is less likely to delay or drop scheduled runs.
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    # Runs repository code and the agent, so it gets no write permission and no publishing token.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # Approvals use another group, so they never wait for a preparation.
    concurrency:
      group: autocontribute-prepare
    permissions:
      contents: read
    steps:
      - name: Check out the configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: autocontribute-state
          path: state
          persist-credentials: false
      - name: Install autocontribute
        uses: ./.github/actions/install-autocontribute
      - name: Prepare one contribution
        env:
          AUTOCONTRIBUTE_GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: autocontribute actions prepare --state state --output "$RUNNER_TEMP/prepared"
      - name: Hand the state to the record job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared
          path: |
            ${{ runner.temp }}/prepared/state.tar.gz
            ${{ runner.temp }}/prepared/prepared.json
          retention-days: 7
          if-no-files-found: error
      - name: Keep the run evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence
          path: ${{ runner.temp }}/prepared/evidence
          retention-days: 30
          if-no-files-found: ignore

  record:
    # Never runs repository code: it checks the prepare job's output as untrusted data, saves
    # the state, and opens one approval issue per prepared fix.
    needs: prepare
    if: ${{ !cancelled() && !github.event.repository.is_template }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: autocontribute-state
      queue: max
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out the configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: autocontribute-state
          path: state
          persist-credentials: false
      - name: Download the prepared state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared
          path: ${{ runner.temp }}/prepared
      - name: Install autocontribute
        uses: ./.github/actions/install-autocontribute
      - name: Save the state and open approval issues
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOCONTRIBUTE_GITHUB_TOKEN: ${{ github.token }}
        run: autocontribute actions record --input "$RUNNER_TEMP/prepared" --state state
