# Shadow-run configuration for a repository owned by the operator.
identity:
  name: "Staging Operator"
  email: "your-handle@users.noreply.github.com"

github:
  auth: token
  token_env: AUTOCONTRIBUTE_STAGING_GITHUB_TOKEN
  repositories:
    - YOUR_ACCOUNT/autocontribute-staging-fixture
  owners: []
  include_labels: ["autocontribute-e2e"]
  exclude_labels: ["security", "blocked", "needs design", "discussion"]
  min_stars: 0
  repository_limit_per_owner: 1
  issue_limit_per_repository: 10
  require_unassigned: true
  max_issue_age_days: 365
  max_repository_inactivity_days: 365

models:
  scout: &staging_model
    provider: openai
    model: gpt-5.6
    # Required for `publishing.mode: auto`: copy the exact immutable model ID returned by the API.
    # expected_response_model: gpt-5.6-YYYY-MM-DD
    # immutable_response_model_attested: true  # only after verifying the provider contract
    api_key_env: OPENAI_API_KEY
    reasoning_effort: high
    reasoning_mode: standard
    max_input_tokens: 500000
    max_output_tokens: 40000
    timeout_seconds: 900
    # Conservative price ceilings, not a built-in price table. Verify for the selected model.
    pricing:
      input_usd_per_million_tokens: 10
      cached_input_usd_per_million_tokens: 10
      cache_write_usd_per_million_tokens: 10
      output_usd_per_million_tokens: 100
  builder: *staging_model
  critic:
    <<: *staging_model
    reasoning_mode: pro

sandbox:
  backend: docker
  # The first fixture intentionally uses only Python's standard library, so a bare interpreter
  # image is sufficient here. Replace it with a digest-pinned, dependency-complete image before
  # adding another repository ecosystem: see docs/sandbox-image.md.
  image: >-
    python:3.12-bookworm@sha256:9bed8554e926c07c6f908841d5ee88c33e8df9236b191526bbce81a9062ab43a
  network: none
  command_timeout_seconds: 300
  memory: 2g
  cpus: 2
  pids_limit: 128
  # One baseline reproduction plus five deduplicated checks before and after one repair pass.
  max_commands: 11

validation:
  required_commands:
    YOUR_ACCOUNT/autocontribute-staging-fixture:
      - python tools/lint.py
      - python tools/typecheck.py
      - python -m unittest discover -s tests/unit -v
      - python -m unittest discover -s tests/integration -v

policy:
  require_maintainer_signal: true
  require_contribution_guidelines: true
  allow_assigned_issues: false
  allow_security_issues: false
  allow_dependency_changes: false
  allow_workflow_changes: false
  ai_disclosure: >-
    This contribution was prepared autonomously by an AI agent. Its validation evidence comes from
    Autocontribute's configured automated checks; no human review is implied.

quality:
  min_candidate_score: 85
  min_readiness_score: 90
  min_dimension_score: 80
  max_files_changed: 5
  max_changed_lines: 200
  max_context_files: 20
  max_context_characters: 120000
  require_validation_commands: true
  require_regression_evidence_for_bugfix: true

publishing:
  mode: review_required
  approval_expires_hours: 12
  draft: true
  # These limits use durable SQLite reservations if a reviewed fixture is manually published.
  max_new_pull_requests_per_day: 1
  max_open_pull_requests: 1
  repository_cooldown_days: 30
  auto_publish_env: AUTOCONTRIBUTE_STAGING_AUTO_PUBLISH_DISABLED

budget:
  max_model_calls_per_run: 6
  max_candidates_per_run: 10
  max_input_tokens_per_run: 3000000
  max_output_tokens_per_run: 240000
  max_model_seconds_per_run: 3600
  max_model_cost_usd_per_run: 50

storage:
  path: .autocontribute-staging

# Optional while this shadow deployment remains `review_required`. Uncomment every field only when
# testing the persistent/systemd path; guarded `auto` always requires this non-secret policy block.
# Keep the AWS credential triplet in the replication service's encrypted credential files, not YAML.
# s3_replication:
#   bundle_directory: /var/backups/autocontribute
#   receipt_directory: /var/backups/autocontribute/receipts
#   scratch_directory: /var/backups/autocontribute/replication-scratch
#   bucket: your-staging-object-lock-bucket
#   expected_bucket_owner: "123456789012"
#   region: ca-central-1
#   prefix: staging/worker-1
#   retention_days: 90       # allowed range: 30..3650
#   timeout_seconds: 21600   # allowed range: 10..86400
#   max_age_hours: 48        # allowed range: 1..8760
